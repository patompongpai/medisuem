  .hero p.lead{color:var(--muted); font-size:16.5px; max-width:620px; margin-top:12px;}

  .btn{

  .explain{margin-top:12px; padding:12px 14px; border-radius:11px; background:var(--surface-2); font-size:13.5px; color:var(--muted); display:none;}

    {f:"STOP SEPSIS 5 STEPS ประกอบด้วยอะไรบ้าง?", b:"1) Hemoculture x2 + serum lactate ใน 1 ชม.แรก 2) Load IV Ringer's lactate 3) ให้ยาต้านจุลชีพภายใน 1 ชม. 4) Early norepinephrine 5) Early refer/consult (พร้อมใส่สายสวนปัสสาวะ)"},
    {f:"Rapid Response System มีองค์ประกอบหลักกี่ส่วน อะไรบ้าง?", b:"4 ส่วน: Efferent limb (ทีม RRT), Afferent limb (ระบบ trigger/early warning score), Administrative limb (ผู้บริหาร) และ Quality improvement limb"},
    {f:"เหตุใดการเฝ้าระวังสัญญาณเตือนล่วงหน้า (early warning signs) จึงสำคัญต่อการลดภาวะวิกฤต?", b:"เพราะผู้ป่วยส่วนใหญ่มีความไม่คงที่ทางสรีรวิทยาล่วงหน้าเฉลี่ย 4-6 ชั่วโมงก่อนเกิดเหตุการณ์วิกฤต และกว่าครึ่งสามารถป้องกันได้หากตอบสนองทัน"},
    {f:"3 ขั้นตอนของการดูแลผู้ป่วยในเครือข่าย sepsis คืออะไร?", b:"1) Early diagnosis/risk classification 2) Initial resuscitation 3) Organ support/monitoring"}
  ],
  quiz:[
    {q:"ข้อใด ไม่ใช่ ส่วนหนึ่งของ STOP SEPSIS 5 STEPS?",
     c:["Hemoculture x2 และ serum lactate ภายใน 1 ชม.","Load IV Ringer's lactate","ทำ CT scan ช่องท้องทุกราย","Early refer/consult พร้อมใส่สายสวนปัสสาวะ"], a:2,
     e:"5 STEPS คือ hemoculture+lactate, load RLS, ATB ภายใน 1 ชม., early NE, early refer/consult — ไม่ได้ระบุ CT scan เป็นข้อบังคับทุกราย"},
    {q:"Rapid Response System ประกอบด้วยกี่องค์ประกอบหลัก?",
     c:["2","3","4","5"], a:2,
     e:"4 องค์ประกอบ: Efferent limb, Afferent limb, Administrative limb, Quality improvement limb"},
    {q:"จากข้อมูลที่ CPG อ้างอิง ผู้ป่วยที่เกิดภาวะวิกฤตในโรงพยาบาลมักมีสัญญาณความไม่คงที่ทางสรีรวิทยาล่วงหน้าโดยเฉลี่ยกี่ชั่วโมง?",
     c:["30 นาที - 1 ชั่วโมง","4-6 ชั่วโมง","24 ชั่วโมง","72 ชั่วโมง"], a:1,
     e:"งานวิจัยที่อ้างอิงพบว่าผู้ป่วยมักมีสัญญาณเตือนล่วงหน้าเฉลี่ย 4-6 ชั่วโมงก่อนเกิดเหตุ ซึ่ง RRS ถูกออกแบบมาเพื่อจับสัญญาณเหล่านี้"}
  ]
},
{ id:"final", nav:"แบบทดสอบรวม", isFinal:true }
];

const EVID_LABEL = {high:"หลักฐานดี", moderate:"หลักฐานปานกลาง", low:"หลักฐานต่ำ", verylow:"หลักฐานต่ำมาก", good:"หลักฐานดี", "high/moderate":"ดี–ปานกลาง"};

const MUST_KNOW = [
  {v:"30", l:"มล./กก. crystalloid ภายใน 3 ชม.แรก"},
  {v:"≥65", l:"มม.ปรอท MAP เป้าหมาย"},
  {v:"<2", l:"มิลลิโมล/ลิตร lactate เป้าหมาย"},
  {v:"≥2", l:"specimens hemoculture ก่อน ATB"},
  {v:"1 ชม.", l:"ให้ ATB ใน septic shock"},
  {v:"6-12 ชม.", l:"ควบคุมแหล่งติดเชื้อหลัง resuscitation"},
  {v:"88-94%", l:"SpO₂ เป้าหมายใน sepsis-induced ARDS"},
  {v:"4-8", l:"มล./กก. low tidal volume"},
  {v:"≤30 / ≤15", l:"ซม.น้ำ plateau / driving pressure"},
  {v:"≥12 ชม.", l:"prone position ต่อวัน"},
  {v:"7-8", l:"ก./ดล. Hb restrictive transfusion"},
  {v:"140-180", l:"มก./ดล. เป้าหมายน้ำตาลในเลือด"},
  {v:"48-72 ชม.", l:"เริ่ม enteral tube feeding"},
  {v:"NE", l:"vasopressor ตัวแรกเสมอ"},
  {v:"≥5", l:"ISTH DIC score = overt DIC"},
  {v:"25-30", l:"มล./กก./ชม. CRRT effluent rate"}
];

/* ============================= STATE ============================= */
const PROGRESS_KEY = "sepsis2569_progress_v1";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();
const chapterList = SECTIONS.filter(s=>!s.isHome && !s.isFinal);

function chapterDone(id){
  const p = PROGRESS[id];
  return !!(p && p.quizDone);
}
function overallPercent(){
  const total = chapterList.length;
  const done = chapterList.filter(s=>chapterDone(s.id)).length;
  return Math.round(done/total*100);
}
function updateTopProgress(){
  const pct = overallPercent();
  document.getElementById("topProgressBar").style.width = pct+"%";
  document.getElementById("topProgressText").textContent = pct+"%";
}

/* ============================= NAV ============================= */
let currentId = "home";

function renderNav(){
  const nav = document.getElementById("sidenav");
  nav.innerHTML = "";
  const label = document.createElement("div");
  label.className = "grp-label"; label.textContent = "SEPSIS 2569";
  nav.appendChild(label);
  SECTIONS.forEach(s=>{
    const btn = document.createElement("button");
    btn.className = "navitem" + (s.id===currentId ? " active":"");
    const n = document.createElement("span"); n.className="n"; n.textContent = s.isHome ? "•" : (s.isFinal ? "★" : s.n);
    btn.appendChild(n);
    const t = document.createElement("span"); t.textContent = s.nav; btn.appendChild(t);
    if(!s.isHome && !s.isFinal){
      const chk = document.createElement("span");
      chk.className = "check" + (chapterDone(s.id) ? " done":"");
      btn.appendChild(chk);
    }
    btn.onclick = ()=>{ currentId = s.id; render(); window.scrollTo({top:0,behavior:"smooth"}); };
    nav.appendChild(btn);
  });
}

/* ============================= RENDER: HOME ============================= */
function renderHome(){
  const main = document.getElementById("main");
  const pct = overallPercent();
  let statTiles = MUST_KNOW.map(m=>`<div class="stat-tile"><div class="v">${m.v}</div><div class="l">${m.l}</div></div>`).join("");
  let progRows = chapterList.map(s=>{
    const p = PROGRESS[s.id];
    const score = p && p.quizBest ? p.quizBest.correct+"/"+p.quizBest.total : "—";
    const barPct = p && p.quizBest ? Math.round(p.quizBest.correct/p.quizBest.total*100) : 0;
    return `<div class="ch-progress-row">
      <div class="t">${s.n}. ${s.title}</div>
      <div class="bar"><i style="width:${barPct}%"></i></div>
      <div class="score">${score}</div>
    </div>`;
  }).join("");
  main.innerHTML = `
    <div class="panel hero">
      <span class="hero-tag">แนวทางเวชปฏิบัติ ฉบับ พ.ศ. 2569 · สมาคมเวชบำบัดวิกฤตแห่งประเทศไทย</span>
      <h1>ห้องเรียน Sepsis &amp; Septic Shock</h1>
      <p class="lead">สรุปสาระสำคัญและแบบฝึกจดจำแนวทางเวชปฏิบัติ CPG Sepsis 2026 ทั้ง 9 บท พร้อมแฟลชการ์ดและแบบทดสอบท้ายบท ออกแบบมาให้คุณหมอทบทวนได้รวดเร็วก่อนขึ้นเวรหรือก่อนสอบ</p>
      <div class="cta-row">
        <button class="btn primary" onclick="goTo('def')">เริ่มเรียนจากบทนิยาม →</button>
        <button class="btn" onclick="goTo('final')">ทำแบบทดสอบรวมทุกบท</button>
      </div>
    </div>

    <div class="section-h"><h2>ตัวเลขที่ต้องจำขึ้นใจ</h2><div class="line"></div></div>
    <div class="stat-grid">${statTiles}</div>

    <div class="section-h"><h2>ความคืบหน้ารายบท</h2><div class="line"></div></div>
    <div class="ch-progress-list">${progRows}</div>

    <div class="footnote">อ้างอิง: แนวทางเวชปฏิบัติสำหรับการวินิจฉัยและการดูแลรักษาผู้ป่วยภาวะพิษเหตุติดเชื้อ (Sepsis) และภาวะช็อกเหตุพิษติดเชื้อ (Septic Shock) ในประเทศไทย พ.ศ. 2569, สมาคมเวชบำบัดวิกฤตแห่งประเทศไทย, ราชวิทยาลัยอายุรแพทย์แห่งประเทศไทย · เอกสารนี้จัดทำเพื่อการทบทวนความรู้ส่วนบุคคลเท่านั้น ไม่ทดแทนวิจารณญาณทางคลินิกหรือฉบับเต็มของแนวทางเวชปฏิบัติ</div>
  `;
}
window.goTo = (id)=>{ currentId = id; render(); window.scrollTo({top:0,behavior:"smooth"}); };

/* ============================= RENDER: CHAPTER ============================= */
function renderChapter(sec){
  const main = document.getElementById("main");
  let chips = sec.chips.map(c=>`<div class="chip"><b>${c.v}</b>${c.l}</div>`).join("");
  let bullets = sec.bullets.map(b=>`<li>${b}</li>`).join("");
  let recs = sec.recs.map(r=>{
    if(!r.s) return `<div class="rec-row"><div class="badges"></div><div class="txt">${r.t}</div></div>`;
    const cls = r.s==="strong" ? "strong" : "conditional";
    const label = r.s==="strong" ? "แนะนำอย่างยิ่ง" : "แนะนำแบบมีเงื่อนไข";
    return `<div class="rec-row">
      <div class="badges"><span class="badge ${cls}">${label}</span><span class="evid">${EVID_LABEL[r.e]||r.e}</span></div>
      <div class="txt">${r.t}</div>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">${sec.n}</div>
        <div>
          <h1>${sec.title}</h1>
          <div class="sub">${sec.sub}</div>
        </div>
      </div>
      <div class="chip-row">${chips}</div>

      <div class="section-h"><h2>สรุปสาระสำคัญ</h2><div class="line"></div></div>
      <ul class="bullets">${bullets}</ul>

      ${sec.recs.length ? `
      <div class="section-h"><h2>คำแนะนำหลัก</h2><div class="line"></div></div>
      <div class="legend">
        <span><i class="strong"></i> Strong recommendation — ควรทำ/ไม่ควรทำ</span>
        <span><i class="conditional"></i> Conditional recommendation — น่าทำ/อาจทำ</span>
      </div>
      ${recs}` : ""}

      <div class="section-h"><h2>แฟลชการ์ดจำขึ้นใจ</h2><div class="line"></div></div>
      <div id="fcArea"></div>

      <div class="section-h"><h2>แบบทดสอบท้ายบท</h2><div class="line"></div></div>
      <div id="quizArea"></div>

    </div>
  `;
  mountFlashcards(sec);
  mountQuiz(sec.id, sec.quiz);
}

/* ============================= FLASHCARDS ============================= */
function mountFlashcards(sec){
  const area = document.getElementById("fcArea");
  let idx = 0;
  const cards = sec.cards;
  function draw(){
    area.innerHTML = `
      <div class="fc-counter">การ์ด ${idx+1} / ${cards.length} — คลิกที่การ์ดเพื่อดูคำตอบ</div>
      <div class="flashcard" id="fcCard">
        <div class="inner">
          <div class="face front">${cards[idx].f}<span class="hint">คลิกเพื่อดูคำตอบ</span></div>
          <div class="face back">${cards[idx].b}<span class="hint">คลิกเพื่อกลับ</span></div>
        </div>
      </div>
      <div class="fc-controls">
        <button class="icon-btn" id="fcPrev">← ก่อนหน้า</button>
        <button class="icon-btn" id="fcShuf">สุ่มการ์ด</button>
        <button class="icon-btn" id="fcNext">ถัดไป →</button>
      </div>
    `;
    const card = document.getElementById("fcCard");
    card.onclick = ()=> card.classList.toggle("flip");
    document.getElementById("fcPrev").onclick = ()=>{ idx = (idx-1+cards.length)%cards.length; draw(); };
    document.getElementById("fcNext").onclick = ()=>{ idx = (idx+1)%cards.length; draw(); markCardsSeen(sec.id); };
    document.getElementById("fcShuf").onclick = ()=>{ idx = Math.floor(Math.random()*cards.length); draw(); };
  }
  draw();
}
function markCardsSeen(id){
  PROGRESS[id] = PROGRESS[id] || {};
  PROGRESS[id].cardsSeen = true;
  saveProgress(PROGRESS);
}

/* ============================= QUIZ ============================= */
function mountQuiz(id, questions, isFinal){
  const area = document.getElementById("quizArea");
  let qi = 0, correct = 0, answered = false;
  const order = questions.map((_,i)=>i);

  function progressDots(){
    return `<div class="quiz-progress">${order.map((_,i)=>`<i class="${i<qi?'done':''}"></i>`).join("")}</div>`;
  }

  function drawQuestion(){
    answered = false;
    const q = questions[order[qi]];
    area.innerHTML = `
      <div class="quiz-box">
        ${progressDots()}
        <div class="quiz-q">${qi+1}. ${q.q}</div>
        <div id="choices">${q.c.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`).join("")}</div>
        <div class="explain" id="explainBox">${q.e}</div>
        <div class="quiz-foot">
          <span class="quiz-score">คะแนน: ${correct}/${qi}</span>
          <button class="btn primary" id="nextBtn" style="display:none;">${qi===order.length-1 ? "ดูผลลัพธ์" : "ข้อถัดไป →"}</button>
        </div>
      </div>
    `;
    document.querySelectorAll("#choices .choice").forEach(btn=>{
      btn.onclick = ()=>{
        if(answered) return;
        answered = true;
        const i = parseInt(btn.dataset.i);
        document.querySelectorAll("#choices .choice").forEach(b=>b.setAttribute("disabled","true"));
        if(i===q.a){ btn.classList.add("correct"); correct++; }
        else{
          btn.classList.add("wrong");
          document.querySelectorAll("#choices .choice")[q.a].classList.add("correct");
        }
        document.getElementById("explainBox").classList.add("show");
        document.querySelector(".quiz-score").textContent = "คะแนน: "+correct+"/"+(qi+1);
        document.getElementById("nextBtn").style.display = "inline-flex";
      };
    });
    document.getElementById("nextBtn").onclick = ()=>{
      qi++;
      if(qi>=order.length){ finish(); } else { drawQuestion(); }
    };
  }

  function finish(){
    const pct = Math.round(correct/order.length*100);
    area.innerHTML = `
      <div class="quiz-box quiz-done">
        <div style="font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;">ผลการทดสอบ</div>
        <div class="v">${correct}/${order.length}</div>
        <p style="color:var(--muted);margin-top:6px;">คิดเป็น ${pct}% — ${pct>=80?"ยอดเยี่ยม จำแม่นมาก!":pct>=50?"ดี ลองทบทวนข้อที่พลาดอีกครั้ง":"ควรทบทวนสรุปสาระสำคัญและคำแนะนำหลักอีกรอบ"}</p>
        <div class="cta-row" style="justify-content:center;">
          <button class="btn" id="retryBtn">ทำแบบทดสอบอีกครั้ง</button>
          ${!isFinal ? `<button class="btn primary" id="nextChBtn">ไปบทถัดไป →</button>` : ""}
        </div>
      </div>
    `;
    if(!isFinal){
      PROGRESS[id] = PROGRESS[id] || {};
      PROGRESS[id].quizDone = true;
      const prevBest = PROGRESS[id].quizBest;
      if(!prevBest || correct > prevBest.correct){ PROGRESS[id].quizBest = {correct, total: order.length}; }
      saveProgress(PROGRESS);
      renderNav();
      updateTopProgress();
    }
    document.getElementById("retryBtn").onclick = ()=>{ qi=0; correct=0; drawQuestion(); };
    const nb = document.getElementById("nextChBtn");
    if(nb){
      nb.onclick = ()=>{
        const idx = chapterList.findIndex(s=>s.id===id);
        const next = chapterList[idx+1];
        currentId = next ? next.id : "final";
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      };
    }
  }

  drawQuestion();
}

/* ============================= RENDER: FINAL QUIZ ============================= */
function renderFinal(){
  const main = document.getElementById("main");
  const pool = [];
  chapterList.forEach(s=> s.quiz.forEach(q=> pool.push(q)) );
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const picked = pool.slice(0, 15);
  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">★</div>
        <div><h1>แบบทดสอบรวมทุกบท</h1><div class="sub">สุ่ม 15 ข้อจากทั้ง 9 บท เพื่อทบทวนก่อนขึ้นเวร/ก่อนสอบ</div></div>
      </div>
      <div id="quizArea" style="margin-top:20px;"></div>
    </div>
  `;
  mountQuiz("final", picked, true);
}

/* ============================= MAIN RENDER ============================= */
function render(){
  renderNav();
  updateTopProgress();
  const sec = SECTIONS.find(s=>s.id===currentId);
  if(sec.isHome) renderHome();
  else if(sec.isFinal) renderFinal();
  else renderChapter(sec);
}
render();
</script>
