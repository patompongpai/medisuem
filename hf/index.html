<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Heart Failure 2026 · HFCT + AHA/ACC + ESC 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F6F4EC;
    --surface:#FFFFFF;
    --surface-2:#EEEADC;
    --ink:#182420;
    --muted:#5B6B64;
    --line:#DED6C1;
    --accent:#1D6A84;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEEF4;
    --danger:#A93A2E;
    --danger-soft:#F5E0DA;
    --warn:#93692A;
    --warn-soft:#F1E5CC;
    --shadow: 0 1px 2px rgba(22,33,31,.07), 0 10px 28px rgba(22,33,31,.08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1613;
      --surface:#11211C;
      --surface-2:#16261F;
      --ink:#E7F1EC;
      --muted:#93A8A1;
      --line:#25382F;
      --accent:#7CC8E2;
      --accent-ink:#05232D;
      --accent-soft:#123543;
      --danger:#FF9080;
      --danger-soft:#3A1B16;
      --warn:#F0BE63;
      --warn-soft:#3A2C12;
      --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1613;
    --surface:#11211C;
    --surface-2:#16261F;
    --ink:#E7F1EC;
    --muted:#93A8A1;
    --line:#25382F;
    --accent:#7CC8E2;
    --accent-ink:#05232D;
    --accent-soft:#123543;
    --danger:#FF9080;
    --danger-soft:#3A1B16;
    --warn:#F0BE63;
    --warn-soft:#3A2C12;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Sarabun',"Noto Sans Thai","IBM Plex Sans Thai",sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{text-wrap:balance; font-family:'Sarabun',sans-serif; margin:0; font-weight:800;}
  .num{font-family:'Fraunces',serif; font-variant-numeric:tabular-nums;}
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--accent-soft);}
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:14px;
    padding:14px 22px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .topbar .mark{
    width:38px;height:38px;border-radius:10px;
    background:var(--accent); color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:18px;
    flex:none;
  }
  .topbar .brand{display:flex; flex-direction:column; line-height:1.2;}
  .topbar .brand b{font-size:16.5px; letter-spacing:.02em;}
  .topbar .brand span{font-size:12px; color:var(--muted);}
  .topbar .progress-pill{
    margin-left:auto; display:flex; align-items:center; gap:9px;
    padding:7px 14px; border-radius:999px; background:var(--surface-2);
    border:1px solid var(--line); font-size:12.5px; color:var(--muted);
    white-space:nowrap;
  }
  .progress-pill b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
  .progress-pill .bar{width:64px; height:6px; border-radius:99px; background:var(--line); overflow:hidden;}
  .progress-pill .bar i{display:block; height:100%; background:var(--accent); width:0%; transition:width .4s ease;}

  /* ---------- shell ---------- */
  .shell{display:grid; grid-template-columns:250px 1fr; max-width:1180px; margin:0 auto; align-items:start;}
  .sidenav{
    position:sticky; top:65px;
    height:calc(100vh - 65px); overflow-y:auto;
    padding:18px 10px 40px;
    border-right:1px solid var(--line);
  }
  .sidenav .grp-label{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); padding:14px 12px 6px;}
  .navitem{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left; padding:9px 12px; border-radius:10px;
    background:transparent; border:none; color:var(--ink); font-size:14.5px;
    margin-bottom:2px;
  }
  .navitem:hover{background:var(--surface-2);}
  .navitem.active{background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .navitem .n{font-family:'IBM Plex Mono',monospace; font-size:11.5px; width:20px; flex:none; color:var(--muted);}
  .navitem.active .n{color:var(--accent);}
  .navitem .check{margin-left:auto; width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); flex:none;}
  .navitem .check.done{background:var(--accent); border-color:var(--accent); position:relative;}
  .navitem .check.done::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg);}

  .main{padding:28px 30px 90px; min-width:0;}
  .panel{max-width:760px;}

  /* ---------- home ---------- */
  .hero-tag{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--accent); background:var(--accent-soft); padding:5px 12px; border-radius:999px; font-weight:700; letter-spacing:.03em;}
  .hero h1{font-size:34px; margin-top:16px; line-height:1.25;}
  .hero p.lead{color:var(--muted); font-size:16.5px; max-width:620px; margin-top:12px;}
  .cta-row{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}
  .btn{
    padding:12px 20px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:14.5px; font-weight:700;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn:hover{filter:brightness(0.97);}

  .stat-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; margin-top:14px;}
  .stat-tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 15px; box-shadow:var(--shadow);
  }
  .stat-tile .v{font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--accent); line-height:1.1;}
  .stat-tile .l{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.4;}

  .section-h{display:flex; align-items:baseline; gap:10px; margin:38px 0 14px;}
  .section-h h2{font-size:19px;}
  .section-h .line{flex:1; height:1px; background:var(--line);}

  .ch-progress-list{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .ch-progress-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 14px;}
  .ch-progress-row .t{flex:1; font-size:14px; font-weight:600;}
  .ch-progress-row .bar{width:110px; height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .ch-progress-row .bar i{display:block; height:100%; background:var(--accent);}
  .ch-progress-row .score{font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; width:54px; text-align:right;}

  /* ---------- chapter header ---------- */
  .ch-head{display:flex; gap:16px; align-items:flex-start;}
  .ch-head .bignum{font-family:'Fraunces',serif; font-size:44px; font-weight:600; color:var(--accent); line-height:1;}
  .ch-head h1{font-size:25px; margin-top:2px;}
  .ch-head .sub{font-size:13.5px; color:var(--muted); margin-top:4px;}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;}
  .chip{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:12.5px;}
  .chip b{display:block; font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--accent);}

  .bullets{margin:12px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px;}
  .bullets li{display:flex; gap:10px; font-size:15px;}
  .bullets li::before{content:"•"; color:var(--accent); font-weight:800; flex:none;}

  .rec-row{
    display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border:1px solid var(--line);
    border-radius:12px; background:var(--surface); margin-bottom:9px;
  }
  .rec-row .badges{display:flex; flex-direction:column; gap:6px; flex:none; width:100px;}
  .badge{font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:4px 8px; border-radius:7px; text-align:center; white-space:nowrap;}
  .badge.strong{background:var(--danger-soft); color:var(--danger);}
  .badge.conditional{background:var(--warn-soft); color:var(--warn);}
  .evid{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted); text-align:center;}
  .rec-row .txt{font-size:14.5px;}
  .rec-row .txt code{background:var(--surface-2); padding:1px 5px; border-radius:5px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;}

  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:10px 0 16px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px; display:inline-block;}
  .legend i.strong{background:var(--danger);}
  .legend i.conditional{background:var(--warn);}

  /* ---------- flashcards ---------- */
  .fc-wrap{margin-top:10px;}
  .fc-counter{font-size:12.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-bottom:8px;}
  .flashcard{
    perspective:1400px; height:200px; margin-bottom:14px;
  }
  .flashcard .inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d; cursor:pointer;
  }
  .flashcard.flip .inner{transform:rotateY(180deg);}
  .flashcard .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:16px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:26px; box-shadow:var(--shadow); border:1px solid var(--line);
  }
  .flashcard .front{background:var(--surface); font-size:17px; font-weight:700;}
  .flashcard .back{background:var(--accent-soft); color:var(--ink); transform:rotateY(180deg); font-size:15px;}
  .flashcard .hint{position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:11px; color:var(--muted); font-weight:400;}
  .fc-controls{display:flex; gap:8px;}
  .icon-btn{
    padding:9px 15px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    font-size:13.5px; font-weight:600; color:var(--ink);
  }
  .icon-btn:hover{background:var(--surface-2);}

  /* ---------- quiz ---------- */
  .quiz-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow);}
  .quiz-progress{display:flex; gap:5px; margin-bottom:16px;}
  .quiz-progress i{flex:1; height:5px; border-radius:99px; background:var(--surface-2);}
  .quiz-progress i.done{background:var(--accent);}
  .quiz-q{font-size:16px; font-weight:700; margin-bottom:14px;}
  .choice{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
    padding:12px 14px; border-radius:11px; border:1.5px solid var(--line); background:var(--surface);
    margin-bottom:9px; font-size:14.5px; color:var(--ink);
  }
  .choice:hover{border-color:var(--accent);}
  .choice .k{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); flex:none; margin-top:1px;}
  .choice.correct{background:var(--accent-soft); border-color:var(--accent);}
  .choice.wrong{background:var(--danger-soft); border-color:var(--danger);}
  .choice[disabled]{cursor:default;}
  .explain{margin-top:12px; padding:12px 14px; border-radius:11px; background:var(--surface-2); font-size:13.5px; color:var(--muted); display:none;}
  .explain.show{display:block;}
  .quiz-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px;}
  .quiz-score{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted);}
  .quiz-done{text-align:center; padding:30px 10px;}
  .quiz-done .v{font-family:'Fraunces',serif; font-size:48px; color:var(--accent); font-weight:600;}

  .footnote{margin-top:60px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:var(--muted);}

  @media (max-width:820px){
    .shell{display:block;}
    .sidenav{
      position:sticky; top:65px; height:auto; width:100%;
      display:flex; overflow-x:auto; gap:4px; padding:10px 12px; border-right:none; border-bottom:1px solid var(--line);
      background:var(--surface);
    }
    .sidenav .grp-label{display:none;}
    .navitem{flex:none; white-space:nowrap;}
    .navitem .check{display:none;}
    .main{padding:22px 16px 70px;}
    .topbar .brand span{display:none;}
  }

  .badge.harm{background:var(--ink); color:var(--surface);}
  .legend i.harm{background:var(--ink);}
  .bullets li a{color:var(--accent);}
  .muted-s{font-size:12.5px;color:var(--muted);margin:6px 0 12px;}
  :root{--ecg-grid:#F1C9C3;--ecg-ink:#1E1A19}
  :root[data-theme="dark"]{--ecg-grid:#3B2624;--ecg-ink:#F3E9E6}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ecg-grid:#3B2624;--ecg-ink:#F3E9E6}}
  .ecg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
  .ecg-fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .ecg-fig svg{width:100%;height:auto;display:block;border-radius:6px;}
  .ecg-fig figcaption{font-size:13px;margin-top:6px;color:var(--muted);} .ecg-fig figcaption b{color:var(--ink);}
  .cmp-wrap{overflow-x:auto;} table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px;}
  table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;}
  table.cmp th{background:var(--surface-2);font-size:12.5px;} table.cmp td:first-child{font-weight:700;}
  .tool-nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px;} .tool-nav a{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--surface-2);}
  .tool{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px;background:var(--surface);scroll-margin-top:80px;}
  .tool h2{font-size:18px;margin:0 0 10px;} .tool h3{font-size:14px;margin:14px 0 6px;color:var(--muted);}
  .q-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap;font-size:14px;}
  .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .seg button{font:inherit;font-size:13px;border:0;background:var(--surface);color:var(--ink);padding:6px 10px;cursor:pointer;border-right:1px solid var(--line);}
  .seg button:last-child{border-right:0;} .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700;}
  .ck{display:flex;flex-direction:column;gap:6px;font-size:14px;} .ck label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;} .ck input{margin-top:4px;accent-color:var(--accent);}
  .inp-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
  .inp-row label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:4px;}
  .inp-row input,.inp-row select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);}
  .result{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14.5px;}
  .result .big{font-family:'Fraunces',serif;font-size:26px;color:var(--accent);}
  .dl{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);} .dl:last-child{border:0} .dl b{flex:0 0 200px;font-size:13.5px;} .dl span{font-size:14px;}
  @media (max-width:560px){.dl{flex-direction:column;gap:2px}.dl b{flex:none}}
  .warnline{margin-top:8px;color:var(--danger);font-weight:700;font-size:13.5px;}
  .tag-y,.tag-n,.tag-w{display:inline-block;font-weight:800;padding:2px 10px;border-radius:999px;margin-right:6px;font-size:13px;}
  .tag-y{background:#2E7D4F;color:#fff}.tag-n{background:var(--danger);color:#fff}.tag-w{background:var(--warn);color:#fff}
  .flow{display:flex;flex-direction:column;gap:6px;font-size:13.5px;}
  .fsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px;} .fsplit.tight{gap:6px;margin-top:6px;}
  .fcol{display:flex;flex-direction:column;gap:6px;}
  .fbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);}
  .fbox.red{border-color:var(--danger);background:var(--danger-soft);} .fbox.warn{border-color:var(--warn);background:var(--warn-soft);} .fbox.ok{border-color:#2E7D4F;background:rgba(46,125,79,.12);}
  .farrow{text-align:center;color:var(--muted);line-height:1;}
  @media (max-width:640px){.fsplit{grid-template-columns:1fr;}}
  .chapbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .cb-item{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:6px 11px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer;}
  .cb-item i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;min-width:22px;height:22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--accent);}
  .cb-item.done i{background:#2E7D4F;color:#fff;}
  .cb-item.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;}
  .cb-item.on i{background:rgba(255,255,255,.25);color:inherit;}
  .pn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px;}
  .pn{font:inherit;font-size:14.5px;font-weight:700;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;}
  .pn.next{text-align:right;} .pn small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-bottom:2px;}
  @media (max-width:820px){ .sidenav{display:none !important;} .cb-item{font-size:12.5px;} }

  .panel.wide{max-width:980px;}
  .lead-s{color:var(--muted);font-size:15px;margin:14px 0 6px;}
  .callout{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;background:var(--surface);}
  .callout .bullets{margin-top:8px;}
  .bullets li a,.lead-s a{color:var(--accent);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px;}
  @media (max-width:640px){.two-col{grid-template-columns:1fr;}}
  .olist{margin:6px 0 0 0;padding-left:22px;font-size:14.5px;display:flex;flex-direction:column;gap:6px;}
  /* LVEF scale */
  .lv-ax{flex:1;position:relative;height:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .lv-ax span{position:absolute;top:0;transform:translateX(-50%);} .lv-ax span:first-child{transform:none;} .lv-ax span:last-child{transform:none;}
  .lv-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .lv-lab{flex:0 0 160px;font-size:12.5px;font-weight:700;line-height:1.3;}
  .lv-bar{flex:1;display:flex;height:32px;border-radius:9px;overflow:hidden;border:1px solid var(--line);}

function renderCases(){
  const main = document.getElementById("main");
  const blk = (set,title)=>`<div class="section-h"><h2>${title}</h2><div class="line"></div></div>` +
    CASES.filter(c=>c.set===set).map(c=>`<div class="case" id="${c.id}"><div class="case-h"><span class="tagset ${set}">${set==="acute"?"ER / ward":"OPD"}</span><h3>${c.t}</h3></div><div class="case-stem">${c.stem}</div><div class="case-steps" data-case="${c.id}"></div></div>`).join("");
  main.innerHTML = `<div class="panel">
    <div class="ch-head"><div class="bignum">✚</div><div><h1>เคสฝึก</h1><div class="sub">ตอบทีละขั้น คำถามถัดไปจะเปิดหลังตอบข้อก่อน · ${CASES.length} เคส</div></div></div>
    ${blk("acute","Acute management: ER และหอผู้ป่วย")}
    ${blk("opd","Follow-up management: OPD")}
  </div>`;
  CASES.forEach(c=>drawCase(c));
}
function drawCase(c){
  const box = document.querySelector(`.case-steps[data-case="${c.id}"]`);
  box.innerHTML = `<div class="ctake" hidden><b>ประเด็นสำคัญ:</b> ${c.take}</div>`;
  addCaseStep(c, box, 0);
}
function addCaseStep(c, box, i){
  const s = c.steps[i];
  const st = document.createElement("div");
  st.className = "cstep";
  st.innerHTML = `<div class="cq"><b>${i+1}.</b> ${s.q}</div>
    <div class="copts">${s.c.map((o,j)=>`<button type="button" data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div>
    <div class="cexp"></div>`;
  box.insertBefore(st, box.querySelector(".ctake"));
  st.querySelectorAll(".copts button").forEach(b=>{
    b.onclick = ()=>{
      if(st.classList.contains("done")) return;
      st.classList.add("done");
      const j = +b.dataset.j;
      b.classList.add(j===s.a?"right":"wrong");
      st.querySelectorAll(".copts button")[s.a].classList.add("right");
      st.querySelector(".cexp").innerHTML = (j===s.a?"<b>ถูกต้อง</b> — ":"<b>ยังไม่ใช่</b> — ")+s.e;
      if(i===c.steps.length-1) box.querySelector(".ctake").hidden=false;
      else addCaseStep(c, box, i+1);
    };
  });
}

function drawFlow(root, path){
  const id = path[path.length-1], n = FLOW[id];
  const trail = path.length>1 ? `<div class="wpath">${path.slice(0,-1).map((p,i)=>{ const nx=path[i+1]; const opt=FLOW[p].o.find(o=>o[1]===nx); return `<span>${opt?opt[0]:""}</span>`; }).join("")}</div>` : "";
  let body;
  if(n.r){
    body = `<div class="wres ${n.r}"><b>${n.t}</b><div>${n.d}</div>${n.go?`<div class="wgo">${n.go.map(g=>`<button type="button" class="icon-btn" data-go="${g[1]}">${g[0]} →</button>`).join("")}</div>`:""}</div>`;
  } else {
    body = `<div class="wq">${n.q}</div><div class="wopts">${n.o.map(o=>`<button type="button" class="btn" data-next="${o[1]}">${o[0]}</button>`).join("")}</div>`;
  }
  root.innerHTML = trail + body + (path.length>1?`<button type="button" class="icon-btn wback">← ย้อน</button> <button type="button" class="icon-btn wreset">เริ่มใหม่</button>`:"");
  root.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>drawFlow(root, path.concat(b.dataset.next)));
  const bk=root.querySelector(".wback"); if(bk) bk.onclick=()=>drawFlow(root, path.slice(0,-1));
  const rs=root.querySelector(".wreset"); if(rs) rs.onclick=()=>drawFlow(root, ["start"]);
  root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==="acs"){ location.href="../acs/index.html"; return; }
    if(g.startsWith("t-")){ document.getElementById(g).scrollIntoView({behavior:"smooth"}); return; }
    goTo(g);
  });
}

    else miss.push(["เริ่ม ARNI", (sbp>=100 && (!egfr||egfr>30))?"sacubitril/valsartan 24/26 มก. bid (ไม่เคยได้ RASi) — ถ้ามีไม่ได้ใช้ enalapril 2.5 มก. bid หรือ losartan 25 มก.":"sacubitril/valsartan 24/26 มก. bid (BP/eGFR ต่ำ) — ถ้าไม่มีใช้ enalapril 2.5 มก. bid"]);
  }
  if(mL===0 && !H.mraStart && !H.mraStop) miss.push(["เริ่ม MRA", `spironolactone ${(k>=4.5||(egfr&&egfr<50))?"12.5":"12.5–25"} มก./วัน · ตรวจ K/Cr ที่ 1 สัปดาห์`]);
  if(bT==="none" && !H.bbStart) miss.push(["เริ่ม beta-blocker", rhythm==="af"?"bisoprolol 1.25 มก./วัน หรือ carvedilol 3.125 มก. bid (ช่วยคุม rate AF)":"bisoprolol 1.25 มก./วัน หรือ carvedilol 3.125 มก. bid"]);
  if(bT==="other") miss.push(["เปลี่ยน beta-blocker","เปลี่ยนเป็น bisoprolol/carvedilol/metoprolol succinate (atenolol, tartrate ไม่มีหลักฐานใน HFrEF)"]);

  // ----- uptitration candidates -----
  const up=[];
  const bbUp = (bT in BB_MAX) && bL<BB_MAX[bT] && !H.bbUp && hr>=60 && sbp>=90;
  const rasUp = (rT in RAS_MAX) && rL<RAS_MAX[rT] && !H.rasUp && !H.rasStop && sbp>=100;
  const rasSwitch = (rT==="acei"||rT==="arb") && !H.rasUp && !H.rasStop && sbp>=100 && !angio;
  const mraUp = mL===1 && !H.mraUp && !H.mraStop && k<5.0 && (!egfr||egfr>30);
  const bbTxt = bbUp ? ["เพิ่ม beta-blocker", `${BB_NAME[bT][bL]} → ${BB_NAME[bT][bL+1]}${hr>=70?" (HR ยังสูง)":""}`] : null;
  let rasTxt=null;
  if(rasSwitch) rasTxt = ["เปลี่ยนเป็น ARNI", rT==="acei" ? `หยุด enalapril 36 ชม.แล้วเริ่ม sacubitril/valsartan ${rL>=3?"49/51":"24/26"} มก. bid` : `หยุด losartan แล้วเริ่ม sacubitril/valsartan ${rL>=3?"49/51":"24/26"} มก. bid ได้ทันที`];
  else if(rasUp) rasTxt = ["เพิ่ม RASi/ARNI", `${RAS_NAME[rT][rL]} → ${RAS_NAME[rT][rL+1]}`];
  const mraTxt = mraUp ? ["เพิ่ม MRA","spironolactone 12.5 → 25 มก./วัน"] : null;
  if(hr>=70){ if(bbTxt) up.push(bbTxt); if(rasTxt) up.push(rasTxt); } else { if(rasTxt) up.push(rasTxt); if(bbTxt) up.push(bbTxt); }
  if(mraTxt) up.push(mraTxt);
  if(H.mraHalf) N.push(["ลด MRA", mL>=2?`spironolactone ${["","12.5","25","50"][mL]} → ${["","6.25 (หรือวันเว้นวัน)","12.5","25"][mL]} มก.`:"spironolactone 12.5 มก. → วันเว้นวันหรือหยุดชั่วคราว"]);

  if(miss.length){
    N.push(...miss.slice(0,2));
    if(miss.length>2) L.push("ยาที่ยังขาดอีก: "+miss.slice(2).map(x=>x[0].replace("เริ่ม ","")).join(", ")+" — เริ่มในนัดถัดไป (เป้าคือได้ครบ 4 กลุ่มขนาดต่ำก่อน)");
    if(up.length) L.push("หลังได้ครบ 4 กลุ่มแล้วจึงเพิ่มขนาด: "+up.map(x=>x[0]).join(", "));
  } else if(up.length){
    N.push(...up.slice(0,2));
    if(up.length>2) L.push("นัดถัดไป: "+up.slice(2).map(x=>x[0]).join(", "));
  } else {
    const atMax = (bT in BB_MAX && bL===BB_MAX[bT]) || H.bbUp;
    N.push(["คงยาเดิม", (A.length?"แก้ปัญหาด้านบนก่อน แล้วค่อยประเมินการเพิ่มยา":"ยาหลักอยู่ที่ขนาดเป้าหมายหรือสูงสุดที่ทนได้")]);
    if(rhythm==="sinus" && hr>=70 && atMax) L.push("Sinus HR ≥70 แม้ beta-blocker สูงสุดที่ทนได้ และ LVEF ≤35% → พิจารณา ivabradine 5 มก. bid (2.5 มก. ในผู้สูงอายุ)");
    L.push("ยังมีอาการ: พิจารณา digoxin ขนาดต่ำ (ESC 2026 IIa) · หลัง worsening HF: vericiguat");
  }
  L.push("ตรวจ iron studies ถ้ายังไม่เคย (TSAT <20% → IV iron)");
  L.push("Echo ซ้ำหลังได้ยาเต็มที่ ≥3 เดือน: LVEF ≤35% → ICD · + LBBB QRS ≥150 ms → CRT");
  F.push("ปรับยาครั้งละ 1–2 ตัว ทุก 1–2 สัปดาห์");
  F.push("ตรวจ K/Cr ใน 1–2 สัปดาห์หลังเริ่มหรือเพิ่ม RASi/ARNI/MRA");
  if(sg!=="none"||miss.some(x=>x[0].includes("SGLT2"))) F.push("SGLT2i: หยุดชั่วคราวเมื่อป่วยหนัก งดอาหาร หรือก่อนผ่าตัด");
  return render(A,N,F,L);

  function render(A,N,F,L){
    return `${A.length?`<div class="gsec"><h4>ความปลอดภัยก่อน</h4>${A.map(a=>`<div class="galert ${a[0]}">${a[1]}</div>`).join("")}</div>`:""}
      <div class="gsec"><h4>ขั้นถัดไปที่แนะนำ (วันนี้)</h4><ol class="gnext">${N.map(n=>`<li><b>${n[0]}</b> — ${n[1]}</li>`).join("")}</ol></div>
      ${L.length?`<div class="gsec"><h4>ต่อจากนี้</h4><ul class="glist">${L.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
      <div class="gsec"><h4>ติดตาม</h4><ul class="glist">${F.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  }
}

function diurAdvice(m){
  const t = m.querySelector("#dType").value, dose=+m.querySelector("#dDose").value||0, egfr=+m.querySelector("#dEgfr").value||0;
  const una = m.querySelector("#dUna").value, uo = m.querySelector("#dUo").value, cur=+m.querySelector("#dCur").value||0;
  const f = {none:0, furo:1, tor:2, bum:40}[t];
  const eq = Math.round(dose*f);
  let out = "";
  if(t==="none"||!eq){
    out += `<div class="dl"><b>เริ่มต้น (ไม่เคยใช้ loop)</b><span>furosemide <b>${egfr&&egfr<30?"40":"20–40"} มก. IV</b> bolus${egfr&&egfr<30?" — eGFR <30 มักต้องใช้ขนาดปลายสูงหรือมากกว่า":""}</span></div>`;
  } else {
    const lo=eq, hi2=eq*2, hi25=Math.round(eq*2.5);
    out += `<div class="dl"><b>Furosemide กินเทียบเท่า</b><span>${eq} มก./วัน${t!=="furo"?` (แปลงจาก ${t==="tor"?"torsemide":"bumetanide"} ${dose} มก.)`:""}</span></div>`;
    out += `<div class="dl"><b>IV ต่อวัน</b><span><b>${lo}–${hi2} มก.</b> (1–2 เท่า, ESC) ถึง ${hi25} มก. (2.5 เท่า, DOSE) · แบ่งให้วันละ 2–3 ครั้ง เช่น ${Math.round(lo/2)}–${Math.round(hi25/2)} มก. IV ทุก 12 ชม.</span></div>`;
    if(hi25>600) out += `<div class="warnline">ขนาดคำนวณเกิน 600 มก./วัน — ใช้ขนาดสูงสุดที่ปลอดภัย พิจารณาเพิ่มยากลุ่มที่สองแทนการเพิ่ม loop</div>`;
  }
  out += `<div class="dl"><b>ประเมินที่ 2 ชม.</b><span>spot urine Na เป้า ≥50–70 mmol/L</span></div><div class="dl"><b>ประเมินที่ 6 ชม.</b><span>ปัสสาวะ ≥100–150 มล./ชม.</span></div>`;
  // response
  let resp = "";
  const unaN = una===""?null:+una, uoN = uo===""?null:+uo;
  if(unaN!==null || uoN!==null){
    const poor = (unaN!==null && unaN<50) || (uoN!==null && uoN<100);
    const grey = !poor && ((unaN!==null && unaN<70) || (uoN!==null && uoN<150));
    const base = cur || (eq?Math.round(eq):40);
    if(poor){
      const nd = Math.min(base*2, 600);
      resp = `<span class="tag-n">ตอบสนองไม่พอ</span> เพิ่มเป็น 2 เท่า: ${base} → <b>${nd} มก. IV</b> ต่อครั้ง แล้วประเมินซ้ำที่ 2/6 ชม.`;
      if(base*2>=400) resp += `<div class="warnline">ใกล้ขนาดสูงสุดแล้ว (furosemide ~400–600 มก./วัน, ถึง 1,000 มก.ถ้าไตเสื่อมมาก) → เพิ่ม sequential nephron blockade</div>`;
    } else if(grey){
      resp = `<span class="tag-w">ก้ำกึ่ง</span> ตอบสนองระดับปานกลาง — ถ้ายังบวมมากหรือปัสสาวะไม่ถึงเป้า พิจารณาเพิ่มขนาด มิฉะนั้นให้ขนาดเดิมซ้ำทุก 12 ชม.`;
    } else {
      resp = `<span class="tag-y">ตอบสนองดี</span> ให้ขนาดเดิมซ้ำทุก 12 ชม. ติดตามน้ำหนัก I/O K Na Cr ทุกวันจนหายบวม`;
    }
  }
  if(resp) out += `<div class="dl"><b>การตอบสนอง</b><span>${resp}</span></div>`;
  out += `<div class="dl"><b>ถ้ายังดื้อ</b><span>เพิ่ม HCTZ 25–100 มก./วัน หรือ metolazone 2.5–5 มก. (ระวัง K/Na ต่ำมาก) <i>หรือ</i> acetazolamide 500 มก. IV วันละครั้ง (ระวัง metabolic acidosis) · SGLT2i เมื่อคงที่ · ยังไม่ได้ผล → ปรึกษา/ส่งต่อ</span></div>`;
  return out;
}

    // iron
    const hb=+m.querySelector("#iHb").value||0, wt=+m.querySelector("#iWt").value||0, fer=+m.querySelector("#iFer").value||0, ts=+m.querySelector("#iTsat").value||0;
    const idOld = fer<100 || (fer<300 && ts<20), idNew = ts<20;
    let tot = 0;
    if(wt>=35){ if(hb<10) tot = wt<70?1500:2000; else if(hb<14) tot = wt<70?1000:1500; else tot = 500; }
    const sched = tot<=1000 ? `${tot} มก. ครั้งเดียว (ครั้งละไม่เกิน ${Math.min(1000, Math.round(20*wt))} มก.)` : `แบ่ง 2 ครั้ง: 1,000 มก. แล้ว ${tot-1000} มก. ห่างกัน ≥7 วัน`;
    m.querySelector("#ironOut").innerHTML = `
      <div class="dl"><b>เกณฑ์เดิม (ferritin/TSAT)</b><span>${idOld?'<span class="tag-y">เข้าเกณฑ์</span>':'<span class="tag-n">ไม่เข้า</span>'}</span></div>
      <div class="dl"><b>ESC 2026 (TSAT &lt;20%)</b><span>${idNew?'<span class="tag-y">เข้าเกณฑ์</span>':'<span class="tag-n">ไม่เข้า</span>'}</span></div>
      <div class="dl"><b>ขนาด FCM รวม</b><span>${wt<35?"น้ำหนัก &lt;35 กก. ดูฉลากยา":`<b>${tot} มก.</b> — ${sched}`}</span></div>
      <div class="dl"><b>ติดตาม</b><span>ตรวจ ferritin/TSAT ซ้ำ 3 เดือน · ระวัง hypophosphatemia เมื่อให้ FCM ซ้ำหลายครั้ง</span></div>`;
  }
}

/* ============================= STATE ============================= */
const PROGRESS_KEY = "hf_progress_v1";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();
const chapterList = SECTIONS.filter(s=>!s.isHome && !s.isFinal && !s.isTool && !s.isPage && !s.isCase);

function chapterDone(id){
  const p = PROGRESS[id];
  return !!(p && p.quizDone);
}
function overallPercent(){
  const total = chapterList.length;
  const done = chapterList.filter(s=>chapterDone(s.id)).length;
  return Math.round(done/total*100);
}
function updateTopProgress(){
  const pct = overallPercent();
  document.getElementById("topProgressBar").style.width = pct+"%";
  document.getElementById("topProgressText").textContent = pct+"%";
}

/* ============================= RENDER: CHAPTER ============================= */
function renderChapter(sec){
  const main = document.getElementById("main");
  let chips = sec.chips.map(c=>`<div class="chip"><b>${c.v}</b>${c.l}</div>`).join("");
  let bullets = sec.bullets.map(b=>`<li><span>${b}</span></li>`).join("");
  let recs = sec.recs.map(r=>{
    if(!r.s) return `<div class="rec-row"><div class="badges"></div><div class="txt">${r.t}</div></div>`;
    const cls = r.s==="strong" ? "strong" : (r.s==="harm" ? "harm" : "conditional");
    const label = r.c || COR_LABEL[r.s];
    return `<div class="rec-row">
      <div class="badges"><span class="badge ${cls}">${label}</span><span class="evid">${r.e}</span></div>
      <div class="txt">${r.t}</div>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">${sec.n}</div>
        <div>
          <h1>${sec.title}</h1>
          <div class="sub">${sec.sub}</div>
        </div>
      </div>
      <div class="chip-row">${chips}</div>

      <div class="section-h"><h2>สรุปสาระสำคัญ</h2><div class="line"></div></div>
      <ul class="bullets">${bullets}</ul>
      ${sec.extraKey ? EXTRAS[sec.extraKey]() : ""}

      ${sec.recs.length ? `
      <div class="section-h"><h2>คำแนะนำหลัก</h2><div class="line"></div></div>
      <div class="legend">
        <span><i class="strong"></i> Class 1/I หรือ "แนะนำ"</span>
        <span><i class="conditional"></i> Class 2a/2b หรือ "ควร/อาจพิจารณา"</span>
        <span><i class="harm"></i> Class 3 — ไม่มีประโยชน์/อันตราย</span>
        <span>ใต้ป้าย = แนวทางที่มา</span>
      </div>
      ${recs}` : ""}

      <div class="section-h"><h2>แฟลชการ์ดจำขึ้นใจ</h2><div class="line"></div></div>
      <div id="fcArea"></div>

      <div class="section-h"><h2>แบบทดสอบท้ายบท</h2><div class="line"></div></div>
      <div id="quizArea"></div>

    </div>
  `;
  mountFlashcards(sec);
  mountQuiz(sec.id, sec.quiz);
}

/* ============================= FLASHCARDS ============================= */
function mountFlashcards(sec){
  const area = document.getElementById("fcArea");
  let idx = 0;
  const cards = sec.cards;
  function draw(){
    area.innerHTML = `
      <div class="fc-counter">การ์ด ${idx+1} / ${cards.length} — คลิกที่การ์ดเพื่อดูคำตอบ</div>
      <div class="flashcard" id="fcCard">
        <div class="inner">
          <div class="face front">${cards[idx].f}<span class="hint">คลิกเพื่อดูคำตอบ</span></div>
          <div class="face back">${cards[idx].b}<span class="hint">คลิกเพื่อกลับ</span></div>
        </div>
      </div>
      <div class="fc-controls">
        <button class="icon-btn" id="fcPrev">← ก่อนหน้า</button>
        <button class="icon-btn" id="fcShuf">สุ่มการ์ด</button>
        <button class="icon-btn" id="fcNext">ถัดไป →</button>
      </div>
    `;
    const card = document.getElementById("fcCard");
    card.onclick = ()=> card.classList.toggle("flip");
    document.getElementById("fcPrev").onclick = ()=>{ idx = (idx-1+cards.length)%cards.length; draw(); };
    document.getElementById("fcNext").onclick = ()=>{ idx = (idx+1)%cards.length; draw(); markCardsSeen(sec.id); };
    document.getElementById("fcShuf").onclick = ()=>{ idx = Math.floor(Math.random()*cards.length); draw(); };
  }
  draw();
}
function markCardsSeen(id){
  PROGRESS[id] = PROGRESS[id] || {};
  PROGRESS[id].cardsSeen = true;
  saveProgress(PROGRESS);
}

/* ============================= QUIZ ============================= */
function mountQuiz(id, questions, isFinal){
  const area = document.getElementById("quizArea");
  let qi = 0, correct = 0, answered = false;
  const order = questions.map((_,i)=>i);

  function progressDots(){
    return `<div class="quiz-progress">${order.map((_,i)=>`<i class="${i<qi?'done':''}"></i>`).join("")}</div>`;
  }

  function drawQuestion(){
    answered = false;
    const q = questions[order[qi]];
    area.innerHTML = `
      <div class="quiz-box">
        ${progressDots()}
        <div class="quiz-q">${qi+1}. ${q.q}</div>
        <div id="choices">${q.c.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`).join("")}</div>
        <div class="explain" id="explainBox">${q.e}</div>
        <div class="quiz-foot">
          <span class="quiz-score">คะแนน: ${correct}/${qi}</span>
          <button class="btn primary" id="nextBtn" style="display:none;">${qi===order.length-1 ? "ดูผลลัพธ์" : "ข้อถัดไป →"}</button>
        </div>
      </div>
    `;
    document.querySelectorAll("#choices .choice").forEach(btn=>{
      btn.onclick = ()=>{
        if(answered) return;
        answered = true;
        const i = parseInt(btn.dataset.i);
        document.querySelectorAll("#choices .choice").forEach(b=>b.setAttribute("disabled","true"));
        if(i===q.a){ btn.classList.add("correct"); correct++; }
        else{
          btn.classList.add("wrong");
          document.querySelectorAll("#choices .choice")[q.a].classList.add("correct");
        }
        document.getElementById("explainBox").classList.add("show");
        document.querySelector(".quiz-score").textContent = "คะแนน: "+correct+"/"+(qi+1);
        document.getElementById("nextBtn").style.display = "inline-flex";
      };
    });
    document.getElementById("nextBtn").onclick = ()=>{
      qi++;
      if(qi>=order.length){ finish(); } else { drawQuestion(); }
    };
  }

  function finish(){
    const pct = Math.round(correct/order.length*100);
    area.innerHTML = `
      <div class="quiz-box quiz-done">
        <div style="font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;">ผลการทดสอบ</div>
        <div class="v">${correct}/${order.length}</div>
        <p style="color:var(--muted);margin-top:6px;">คิดเป็น ${pct}% — ${pct>=80?"ยอดเยี่ยม จำแม่นมาก!":pct>=50?"ดี ลองทบทวนข้อที่พลาดอีกครั้ง":"ควรทบทวนสรุปสาระสำคัญและคำแนะนำหลักอีกรอบ"}</p>
        <div class="cta-row" style="justify-content:center;">
          <button class="btn" id="retryBtn">ทำแบบทดสอบอีกครั้ง</button>
          ${!isFinal ? `<button class="btn primary" id="nextChBtn">ไปบทถัดไป →</button>` : ""}
        </div>
      </div>
    `;
    if(!isFinal){
      PROGRESS[id] = PROGRESS[id] || {};
      PROGRESS[id].quizDone = true;
      const prevBest = PROGRESS[id].quizBest;
      if(!prevBest || correct > prevBest.correct){ PROGRESS[id].quizBest = {correct, total: order.length}; }
      saveProgress(PROGRESS);
      renderNav();
      updateTopProgress();
    }
    document.getElementById("retryBtn").onclick = ()=>{ qi=0; correct=0; drawQuestion(); };
    const nb = document.getElementById("nextChBtn");
    if(nb){
      nb.onclick = ()=>{
        const idx = chapterList.findIndex(s=>s.id===id);
        const next = chapterList[idx+1];
        currentId = next ? next.id : "final";
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      };
    }
  }

  drawQuestion();
}

/* ============================= RENDER: FINAL QUIZ ============================= */
function renderFinal(){
  const main = document.getElementById("main");
  const pool = [];
  chapterList.forEach(s=> s.quiz.forEach(q=> pool.push(q)) );
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const picked = pool.slice(0, 15);
  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">★</div>
        <div><h1>แบบทดสอบรวมทุกบท</h1><div class="sub">สุ่ม 15 ข้อจากทั้ง 7 บท เพื่อทบทวนก่อนขึ้นเวร/ก่อนสอบ</div></div>
      </div>
      <div id="quizArea" style="margin-top:20px;"></div>
    </div>
  `;
  mountQuiz("final", picked, true);
}

/* ============================= MAIN RENDER ============================= */
function render(){
  renderNav();
  updateTopProgress();
  const sec = SECTIONS.find(s=>s.id===currentId);
  if(sec.isHome) renderHome();
  else if(sec.isFinal) renderFinal();
  else if(sec.isTool) renderTools();
  else if(sec.isPage) renderCompare();
  else if(sec.isCase) renderCases();
  else renderChapter(sec);
  mountChapBar(sec);
}
function mountChapBar(sec){
  const main=document.getElementById("main");
  const items=SECTIONS.map(s=>{
    const num = s.isHome ? "⌂" : (s.isFinal ? "★" : s.n);
    const done = (!s.isHome && !s.isFinal && !s.isTool && !s.isPage && !s.isCase && chapterDone(s.id)) ? " done" : "";
    return `<button type="button" class="cb-item${s.id===sec.id?' on':''}${done}" onclick="goTo('${s.id}')"><i>${num}</i>${s.nav}</button>`;
  }).join("");
  main.insertAdjacentHTML("afterbegin", `<nav class="chapbar" aria-label="เลือกบท">${items}</nav>`);
  const idx=SECTIONS.findIndex(s=>s.id===sec.id);
  const prev=SECTIONS[idx-1], next=SECTIONS[idx+1];
  const btn=(s,dir)=> s ? `<button type="button" class="pn ${dir}" onclick="goTo('${s.id}')"><small>${dir==='prev'?'← บทก่อนหน้า':'บทถัดไป →'}</small>${s.isHome?'หน้าแรก':(s.isFinal||s.isTool||s.isPage||s.isCase?'':s.n+'. ')+s.nav}</button>` : `<span></span>`;
  if(!sec.isHome) main.insertAdjacentHTML("beforeend", `<div class="pn-row">${btn(prev,'prev')}${btn(next,'next')}</div>`);
}
render();
</script>
