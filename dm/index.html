/* ============================= STATE ============================= */
const PROGRESS_KEY = "dm2566_progress_v1";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();
const chapterList = SECTIONS.filter(s=>!s.isHome && !s.isFinal);

function chapterDone(id){
  const p = PROGRESS[id];
  return !!(p && p.quizDone);
}
function overallPercent(){
  const total = chapterList.length;
  const done = chapterList.filter(s=>chapterDone(s.id)).length;
  return Math.round(done/total*100);
}
function updateTopProgress(){
  const pct = overallPercent();
  document.getElementById("topProgressBar").style.width = pct+"%";
  document.getElementById("topProgressText").textContent = pct+"%";
}

/* ============================= NAV ============================= */
let currentId = "home";

function buildNavList(nav, onPick){
  SECTIONS.forEach(s=>{
    const btn = document.createElement("button");
    btn.className = "navitem" + (s.id===currentId ? " active":"");
    const n = document.createElement("span"); n.className="n"; n.textContent = s.isHome ? "•" : (s.isFinal ? "★" : s.n);
    btn.appendChild(n);
    const t = document.createElement("span"); t.textContent = s.nav; btn.appendChild(t);
    if(!s.isHome && !s.isFinal){
      const chk = document.createElement("span");
      chk.className = "check" + (chapterDone(s.id) ? " done":"");
      btn.appendChild(chk);
    }
    btn.onclick = ()=>{ if(onPick) onPick(); goTo(s.id); };
    nav.appendChild(btn);
  });
}
function renderNav(){
  const nav = document.getElementById("sidenav");
  nav.innerHTML = "";
  const label = document.createElement("div");
  label.className = "grp-label"; label.textContent = "DM 2566";
  nav.appendChild(label);
  buildNavList(nav);
}

let pendingFocus = null;
window.goTo = (id, focus)=>{
  currentId = id; pendingFocus = focus || null;

/* ============================= RENDER: CHAPTER ============================= */
function renderChapter(sec){
  const main = document.getElementById("main");
  let chips = sec.chips.map((c,i)=>`<div class="chip" id="t-chip-${i}"><b>${c.v}</b>${c.l}</div>`).join("");
  let bullets = sec.bullets.map((b,i)=>`<li id="t-bullet-${i}">${b}</li>`).join("");

    const cls = WEIGHT_CLASS[r.w] || "pm";
    const label = WEIGHT_LABEL[r.w] || r.w;
    return `<div class="rec-row" id="t-rec-${i}">
      <div class="badges"><span class="badge ${cls}">${r.w} ${label}</span><span class="evid">คุณภาพหลักฐานระดับ ${r.lvl}</span></div>
      <div class="txt">${r.t}</div>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">${sec.n}</div>
        <div>
          <h1>${sec.title}</h1>
          <div class="sub">${sec.sub}</div>
        </div>
      </div>
      <div class="chip-row">${chips}</div>

      <div class="section-h"><h2>สรุปสาระสำคัญ</h2><div class="line"></div></div>
      <ul class="bullets">${bullets}</ul>

      ${sec.recs.length ? `
      <div class="section-h"><h2>คำแนะนำหลัก (น้ำหนักคำแนะนำ + คุณภาพหลักฐาน)</h2><div class="line"></div></div>
      <div class="legend">
        <span><i class="pp"></i> ++ ควรทำอย่างยิ่ง</span>
        <span><i class="p"></i> + น่าทำ</span>
        <span><i class="pm"></i> +/- อาจทำหรือไม่ทำ</span>
        <span><i class="m"></i> - ไม่น่าทำ</span>
        <span><i class="mm"></i> -- ไม่ควรทำอย่างยิ่ง</span>
      </div>
      ${recs}` : ""}

      <div class="section-h"><h2>แฟลชการ์ดจำขึ้นใจ</h2><div class="line"></div></div>
      <div id="fcArea"></div>

      <div class="section-h"><h2>แบบทดสอบท้ายบท</h2><div class="line"></div></div>
      <div id="quizArea"></div>

      ${pagerHTML(sec)}
    </div>
  `;
  mountFlashcards(sec, pendingFocus && pendingFocus.kind==="card" ? pendingFocus.idx : 0);
  mountQuiz(sec.id, sec.quiz);
}

function pagerHTML(sec){
  const i = chapterList.findIndex(s=>s.id===sec.id);
  const prev = chapterList[i-1], next = chapterList[i+1];
  const prevBtn = prev ? `<button onclick="goTo('${prev.id}')"><small>← บทก่อนหน้า</small><b>${prev.nav}</b></button>` : `<button class="ghost" tabindex="-1" aria-hidden="true"></button>`;
  const nextBtn = next ? `<button class="next" onclick="goTo('${next.id}')"><small>บทถัดไป →</small><b>${next.nav}</b></button>`
                       : `<button class="next" onclick="goTo('final')"><small>ไปต่อ →</small><b>แบบทดสอบรวม</b></button>`;
  return `<div class="pager">${prevBtn}${nextBtn}</div>`;
}

function applyFocus(f){
  const map = {chip:"t-chip-", bullet:"t-bullet-", rec:"t-rec-", tile:"t-tile-"};
  let el = null;
  if(map[f.kind]) el = document.getElementById(map[f.kind]+f.idx);
  else if(f.kind==="card") el = document.getElementById("fcArea");
  else if(f.kind==="quiz") el = document.getElementById("quizArea");
  else if(f.kind==="title") el = document.querySelector(".ch-head");
  if(!el){ window.scrollTo({top:0}); return; }
  requestAnimationFrame(()=>{
    el.scrollIntoView({block:"center", behavior:"smooth"});
    const target = f.kind==="card" ? el.querySelector(".flashcard .face.front") : el;
    if(target){ target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash"); }
  });
}

/* ============================= FLASHCARDS ============================= */
function mountFlashcards(sec, startIdx){
  const area = document.getElementById("fcArea");
  let idx = startIdx || 0;
  const cards = sec.cards;
  function draw(){
    area.innerHTML = `
      <div class="fc-counter">การ์ด ${idx+1} / ${cards.length} — คลิกที่การ์ดเพื่อดูคำตอบ</div>
      <div class="flashcard" id="fcCard">
        <div class="inner">
          <div class="face front">${cards[idx].f}<span class="hint">คลิกเพื่อดูคำตอบ</span></div>
          <div class="face back">${cards[idx].b}<span class="hint">คลิกเพื่อกลับ</span></div>
        </div>
      </div>
      <div class="fc-controls">
        <button class="icon-btn" id="fcPrev">← ก่อนหน้า</button>
        <button class="icon-btn" id="fcShuf">สุ่มการ์ด</button>
        <button class="icon-btn" id="fcNext">ถัดไป →</button>
      </div>
    `;
    const card = document.getElementById("fcCard");
    card.onclick = ()=> card.classList.toggle("flip");
    document.getElementById("fcPrev").onclick = ()=>{ idx = (idx-1+cards.length)%cards.length; draw(); };
    document.getElementById("fcNext").onclick = ()=>{ idx = (idx+1)%cards.length; draw(); markCardsSeen(sec.id); };
    document.getElementById("fcShuf").onclick = ()=>{ idx = Math.floor(Math.random()*cards.length); draw(); };
  }
  draw();
}
function markCardsSeen(id){
  PROGRESS[id] = PROGRESS[id] || {};
  PROGRESS[id].cardsSeen = true;
  saveProgress(PROGRESS);
}

/* ============================= QUIZ ============================= */
function mountQuiz(id, questions, isFinal){
  const area = document.getElementById("quizArea");
  let qi = 0, correct = 0, answered = false;
  const order = questions.map((_,i)=>i);

  function progressDots(){
    return `<div class="quiz-progress">${order.map((_,i)=>`<i class="${i<qi?'done':''}"></i>`).join("")}</div>`;
  }

  function drawQuestion(){
    answered = false;
    const q = questions[order[qi]];
    area.innerHTML = `
      <div class="quiz-box">
        ${progressDots()}
        <div class="quiz-q">${qi+1}. ${q.q}</div>
        <div id="choices">${q.c.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`).join("")}</div>
        <div class="explain" id="explainBox">${q.e}</div>
        <div class="quiz-foot">
          <span class="quiz-score">คะแนน: ${correct}/${qi}</span>
          <button class="btn primary" id="nextBtn" style="display:none;">${qi===order.length-1 ? "ดูผลลัพธ์" : "ข้อถัดไป →"}</button>
        </div>
      </div>
    `;
    document.querySelectorAll("#choices .choice").forEach(btn=>{
      btn.onclick = ()=>{
        if(answered) return;
        answered = true;
        const i = parseInt(btn.dataset.i);
        document.querySelectorAll("#choices .choice").forEach(b=>b.setAttribute("disabled","true"));
        if(i===q.a){ btn.classList.add("correct"); correct++; }
        else{
          btn.classList.add("wrong");
          document.querySelectorAll("#choices .choice")[q.a].classList.add("correct");
        }
        document.getElementById("explainBox").classList.add("show");
        document.querySelector(".quiz-score").textContent = "คะแนน: "+correct+"/"+(qi+1);
        document.getElementById("nextBtn").style.display = "inline-flex";
      };
    });
    document.getElementById("nextBtn").onclick = ()=>{
      qi++;
      if(qi>=order.length){ finish(); } else { drawQuestion(); }
    };
  }

  function finish(){
    const pct = Math.round(correct/order.length*100);
    area.innerHTML = `
      <div class="quiz-box quiz-done">
        <div style="font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;">ผลการทดสอบ</div>
        <div class="v">${correct}/${order.length}</div>
        <p style="color:var(--muted);margin-top:6px;">คิดเป็น ${pct}% — ${pct>=80?"ยอดเยี่ยม จำแม่นมาก!":pct>=50?"ดี ลองทบทวนข้อที่พลาดอีกครั้ง":"ควรทบทวนสรุปสาระสำคัญและคำแนะนำหลักอีกรอบ"}</p>
        <div class="cta-row" style="justify-content:center;">
          <button class="btn" id="retryBtn">ทำแบบทดสอบอีกครั้ง</button>
          ${!isFinal ? `<button class="btn primary" id="nextChBtn">ไปบทถัดไป →</button>` : ""}
        </div>
      </div>
    `;
    if(!isFinal){
      PROGRESS[id] = PROGRESS[id] || {};
      PROGRESS[id].quizDone = true;
      const prevBest = PROGRESS[id].quizBest;
      if(!prevBest || correct > prevBest.correct){ PROGRESS[id].quizBest = {correct, total: order.length}; }
      saveProgress(PROGRESS);
      renderNav();
      updateTopProgress();
    }
    document.getElementById("retryBtn").onclick = ()=>{ qi=0; correct=0; drawQuestion(); };
    const nb = document.getElementById("nextChBtn");
    if(nb){
      nb.onclick = ()=>{
        const idx = chapterList.findIndex(s=>s.id===id);
        const next = chapterList[idx+1];
        currentId = next ? next.id : "final";
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      };
    }
  }

  drawQuestion();
}

/* ============================= RENDER: FINAL QUIZ ============================= */
function renderFinal(){
  const main = document.getElementById("main");
  const pool = [];
  chapterList.forEach(s=> s.quiz.forEach(q=> pool.push(q)) );
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const picked = pool.slice(0, 20);
  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">★</div>
        <div><h1>แบบทดสอบรวมทุกบท</h1><div class="sub">สุ่ม 20 ข้อจากทุกบทของ DM CPG 2566 เพื่อทบทวนก่อนขึ้นเวร/ก่อนสอบ</div></div>
      </div>
      <div id="quizArea" style="margin-top:20px;"></div>
    </div>
  `;
  mountQuiz("final", picked, true);
}

const searchOverlay = document.getElementById("searchOverlay");

function openOverlay(ov){ lastFocusEl = document.activeElement; ov.hidden = false; document.body.style.overflow = "hidden"; }
function closeOverlay(ov){ ov.hidden = true; if(sheetOverlay.hidden && searchOverlay.hidden) document.body.style.overflow = ""; if(lastFocusEl && lastFocusEl.focus) lastFocusEl.focus(); }

/* ============================= SEARCH ============================= */
const KIND_LABEL = {title:"หัวข้อบท", chip:"ตัวเลขสำคัญ", tile:"ตัวเลขต้องจำ", bullet:"สรุป", rec:"คำแนะนำ", card:"แฟลชการ์ด", quiz:"แบบทดสอบ"};
const stripTags = t => String(t).replace(/<[a-z\/][^>]*>/gi, "");
const SEARCH_INDEX = [];
MUST_KNOW.forEach((m,i)=> SEARCH_INDEX.push({sec:"home", kind:"tile", idx:i, text:m.v+" — "+m.l}));
chapterList.forEach(s=>{
  SEARCH_INDEX.push({sec:s.id, kind:"title", idx:0, text:s.title+" · "+s.sub});
  s.chips.forEach((c,i)=> SEARCH_INDEX.push({sec:s.id, kind:"chip", idx:i, text:c.v+" — "+c.l}));
  s.bullets.forEach((b,i)=> SEARCH_INDEX.push({sec:s.id, kind:"bullet", idx:i, text:stripTags(b)}));
  s.recs.forEach((r,i)=> SEARCH_INDEX.push({sec:s.id, kind:"rec", idx:i, text:r.t, extra:r.w+" "+(WEIGHT_LABEL[r.w]||"")+" · หลักฐานระดับ "+r.lvl}));
  s.cards.forEach((c,i)=> SEARCH_INDEX.push({sec:s.id, kind:"card", idx:i, text:c.f, extra:c.b}));
  s.quiz.forEach((q,i)=> SEARCH_INDEX.push({sec:s.id, kind:"quiz", idx:i, text:q.q, extra:q.c[q.a], explain:q.e}));
});
SEARCH_INDEX.forEach(it=> it.hay = [it.text, it.extra||"", it.explain||""].join(" ").toLowerCase());

const SUGGEST = ["metformin","SGLT2","GLP-1","insulin","eGFR","A1C","DKA","HHS","น้ำตาลต่ำ","CGM","GDM","ตั้งครรภ์","เด็ก","monofilament","รอมฎอน","OGTT"];
const esc = t => String(t).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function hilite(text, terms, crop){
  let t = String(text);
  if(crop && t.length > crop){
    const low = t.toLowerCase();
    let pos = -1;
    for(const term of terms){ const p = low.indexOf(term); if(p>=0 && (pos<0 || p<pos)) pos = p; }
    if(pos > crop*0.4){ const start = Math.max(0, pos - Math.floor(crop*0.35)); t = "…" + t.slice(start); }
    if(t.length > crop) t = t.slice(0, crop) + "…";
  }
  let out = esc(t);
  if(!terms.length) return out;
  const re = new RegExp("(" + terms.map(x=>reEsc(esc(x))).join("|") + ")", "gi");
  return out.replace(re, "<mark>$1</mark>");
}

function runSearch(q){
  const body = document.getElementById("searchBody");
  const terms = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length){
    body.innerHTML = `<div class="search-meta">คำค้นยอดนิยม</div>
      <div class="suggest">${SUGGEST.map(k=>`<button data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div>
      <div class="empty">ค้นได้ทั้งสรุป คำแนะนำ ตัวเลขสำคัญ แฟลชการ์ด และแบบทดสอบ — ใส่หลายคำเว้นวรรคเพื่อค้นให้แคบลง</div>`;
    body.querySelectorAll(".suggest button").forEach(b=> b.onclick = ()=>{ const inp = document.getElementById("searchInput"); inp.value = b.dataset.k; runSearch(inp.value); inp.focus(); });
    return;
  }
  const hits = SEARCH_INDEX.filter(it=> terms.every(t=> it.hay.includes(t)));
  if(!hits.length){
    body.innerHTML = `<div class="empty">ไม่พบ “${esc(q.trim())}” — ลองใช้คำที่สั้นลง หรือสะกดเป็นภาษาอังกฤษ เช่น “SGLT2” แทน “เอสจีแอลที”</div>`;
    return;
  }
  const order = ["home", ...chapterList.map(s=>s.id)];
  const groups = {};
  hits.forEach(h=>{ (groups[h.sec] = groups[h.sec] || []).push(h); });
  const secIds = order.filter(id=>groups[id]);
  let html = `<div class="search-meta">พบ ${hits.length} รายการ ใน ${secIds.length} ส่วน</div>`;
  secIds.forEach(id=>{
    const sec = SECTIONS.find(s=>s.id===id);
    const head = id==="home" ? `หน้าแรก <span>ตัวเลขที่ต้องจำ</span>` : `บทที่ ${sec.n} <span>${esc(sec.title)}</span>`;
    html += `<div class="sr-group"><div class="sr-group-h">${head}</div>`;
    groups[id].forEach(h=>{
      let main = hilite(h.text, terms, 200);
      let ans = "";
      if(h.kind==="card") ans = `<span class="sr-ans">${hilite(h.extra, terms, 200)}</span>`;
      if(h.kind==="quiz") ans = `<span class="sr-ans">เฉลย: <b>${hilite(h.extra, terms)}</b></span>`;
      if(h.kind==="rec") ans = `<span class="sr-ans">${esc(h.extra)}</span>`;
      html += `<button class="sr-item" data-sec="${h.sec}" data-kind="${h.kind}" data-idx="${h.idx}"><span class="sr-kind">${KIND_LABEL[h.kind]}</span>${main}${ans}</button>`;
    });
    html += `</div>`;
  });
  body.innerHTML = html;
  body.querySelectorAll(".sr-item").forEach(b=>{
    b.onclick = ()=>{
      searchOverlay.hidden = true; document.body.style.overflow = "";
      goTo(b.dataset.sec, {kind:b.dataset.kind, idx:parseInt(b.dataset.idx)});
    };
  });
}

let searchTimer = null;
function openSearch(){
  openOverlay(searchOverlay);
  const inp = document.getElementById("searchInput");
  runSearch(inp.value);
  setTimeout(()=>{ inp.focus(); inp.select(); }, 30);
}
document.getElementById("searchBtn").onclick = openSearch;
document.getElementById("searchClose").onclick = ()=>closeOverlay(searchOverlay);
searchOverlay.addEventListener("click", e=>{ if(e.target===searchOverlay) closeOverlay(searchOverlay); });
document.getElementById("searchInput").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>runSearch(e.target.value), 90);
});
document.getElementById("searchInput").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const first = document.querySelector("#searchBody .sr-item"); if(first){ e.preventDefault(); first.click(); } }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if(!searchOverlay.hidden) closeOverlay(searchOverlay);
    else if(!sheetOverlay.hidden) closeOverlay(sheetOverlay);
    return;
  }
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(!typing && (e.key==="/" || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"))){ e.preventDefault(); openSearch(); }
});

/* ============================= MAIN RENDER ============================= */
function render(){
  renderNav();
  updateTopProgress();
  const sec = SECTIONS.find(s=>s.id===currentId);
  if(sec.isHome) renderHome();
  else if(sec.isFinal) renderFinal();
  else renderChapter(sec);
}
render();
</script>
