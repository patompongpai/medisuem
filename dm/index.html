/* ============================= STATE ============================= */
const PROGRESS_KEY = "dm2566_progress_v1";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();
const chapterList = SECTIONS.filter(s=>!s.isHome && !s.isFinal);

function chapterDone(id){
  const p = PROGRESS[id];
  return !!(p && p.quizDone);
}
function overallPercent(){
  const total = chapterList.length;
  const done = chapterList.filter(s=>chapterDone(s.id)).length;
  return Math.round(done/total*100);
}
function updateTopProgress(){
  const pct = overallPercent();
  document.getElementById("topProgressBar").style.width = pct+"%";
  document.getElementById("topProgressText").textContent = pct+"%";
}

let currentId = "home";

function renderNav(){
  const nav = document.getElementById("sidenav");
  nav.innerHTML = "";
  const label = document.createElement("div");
  label.className = "grp-label"; label.textContent = "DM 2566";
  nav.appendChild(label);
  SECTIONS.forEach(s=>{
    const btn = document.createElement("button");
    btn.className = "navitem" + (s.id===currentId ? " active":"");
    const n = document.createElement("span"); n.className="n"; n.textContent = s.isHome ? "•" : (s.isFinal ? "★" : s.n);
    btn.appendChild(n);
    const t = document.createElement("span"); t.textContent = s.nav; btn.appendChild(t);
    if(!s.isHome && !s.isFinal){
      const chk = document.createElement("span");
      chk.className = "check" + (chapterDone(s.id) ? " done":"");
      btn.appendChild(chk);
    }
    btn.onclick = ()=>{ currentId = s.id; render(); window.scrollTo({top:0,behavior:"smooth"}); };
    nav.appendChild(btn);
  });
}

/* ============================= FLASHCARDS ============================= */
function mountFlashcards(sec){
  const area = document.getElementById("fcArea");
  let idx = 0;
  const cards = sec.cards;
  function draw(){
    area.innerHTML = `
      <div class="fc-counter">การ์ด ${idx+1} / ${cards.length} — คลิกที่การ์ดเพื่อดูคำตอบ</div>
      <div class="flashcard" id="fcCard">
        <div class="inner">
          <div class="face front">${cards[idx].f}<span class="hint">คลิกเพื่อดูคำตอบ</span></div>
          <div class="face back">${cards[idx].b}<span class="hint">คลิกเพื่อกลับ</span></div>
        </div>
      </div>
      <div class="fc-controls">
        <button class="icon-btn" id="fcPrev">← ก่อนหน้า</button>
        <button class="icon-btn" id="fcShuf">สุ่มการ์ด</button>
        <button class="icon-btn" id="fcNext">ถัดไป →</button>
      </div>
    `;
    const card = document.getElementById("fcCard");
    card.onclick = ()=> card.classList.toggle("flip");
    document.getElementById("fcPrev").onclick = ()=>{ idx = (idx-1+cards.length)%cards.length; draw(); };
    document.getElementById("fcNext").onclick = ()=>{ idx = (idx+1)%cards.length; draw(); markCardsSeen(sec.id); };
    document.getElementById("fcShuf").onclick = ()=>{ idx = Math.floor(Math.random()*cards.length); draw(); };
  }
  draw();
}
function markCardsSeen(id){
  PROGRESS[id] = PROGRESS[id] || {};
  PROGRESS[id].cardsSeen = true;
  saveProgress(PROGRESS);
}

/* ============================= QUIZ ============================= */
function mountQuiz(id, questions, isFinal){
  const area = document.getElementById("quizArea");
  let qi = 0, correct = 0, answered = false;
  const order = questions.map((_,i)=>i);

  function progressDots(){
    return `<div class="quiz-progress">${order.map((_,i)=>`<i class="${i<qi?'done':''}"></i>`).join("")}</div>`;
  }

  function drawQuestion(){
    answered = false;
    const q = questions[order[qi]];
    area.innerHTML = `
      <div class="quiz-box">
        ${progressDots()}
        <div class="quiz-q">${qi+1}. ${q.q}</div>
        <div id="choices">${q.c.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`).join("")}</div>
        <div class="explain" id="explainBox">${q.e}</div>
        <div class="quiz-foot">
          <span class="quiz-score">คะแนน: ${correct}/${qi}</span>
          <button class="btn primary" id="nextBtn" style="display:none;">${qi===order.length-1 ? "ดูผลลัพธ์" : "ข้อถัดไป →"}</button>
        </div>
      </div>
    `;
    document.querySelectorAll("#choices .choice").forEach(btn=>{
      btn.onclick = ()=>{
        if(answered) return;
        answered = true;
        const i = parseInt(btn.dataset.i);
        document.querySelectorAll("#choices .choice").forEach(b=>b.setAttribute("disabled","true"));
        if(i===q.a){ btn.classList.add("correct"); correct++; }
        else{
          btn.classList.add("wrong");
          document.querySelectorAll("#choices .choice")[q.a].classList.add("correct");
        }
        document.getElementById("explainBox").classList.add("show");
        document.querySelector(".quiz-score").textContent = "คะแนน: "+correct+"/"+(qi+1);
        document.getElementById("nextBtn").style.display = "inline-flex";
      };
    });
    document.getElementById("nextBtn").onclick = ()=>{
      qi++;
      if(qi>=order.length){ finish(); } else { drawQuestion(); }
    };
  }

  function finish(){
    const pct = Math.round(correct/order.length*100);
    area.innerHTML = `
      <div class="quiz-box quiz-done">
        <div style="font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;">ผลการทดสอบ</div>
        <div class="v">${correct}/${order.length}</div>
        <p style="color:var(--muted);margin-top:6px;">คิดเป็น ${pct}% — ${pct>=80?"ยอดเยี่ยม จำแม่นมาก!":pct>=50?"ดี ลองทบทวนข้อที่พลาดอีกครั้ง":"ควรทบทวนสรุปสาระสำคัญและคำแนะนำหลักอีกรอบ"}</p>
        <div class="cta-row" style="justify-content:center;">
          <button class="btn" id="retryBtn">ทำแบบทดสอบอีกครั้ง</button>
          ${!isFinal ? `<button class="btn primary" id="nextChBtn">ไปบทถัดไป →</button>` : ""}
        </div>
      </div>
    `;
    if(!isFinal){
      PROGRESS[id] = PROGRESS[id] || {};
      PROGRESS[id].quizDone = true;
      const prevBest = PROGRESS[id].quizBest;
      if(!prevBest || correct > prevBest.correct){ PROGRESS[id].quizBest = {correct, total: order.length}; }
      saveProgress(PROGRESS);
      renderNav();
      updateTopProgress();
    }
    document.getElementById("retryBtn").onclick = ()=>{ qi=0; correct=0; drawQuestion(); };
    const nb = document.getElementById("nextChBtn");
    if(nb){
      nb.onclick = ()=>{
        const idx = chapterList.findIndex(s=>s.id===id);
        const next = chapterList[idx+1];
        currentId = next ? next.id : "final";
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      };
    }
  }

  drawQuestion();
}

/* ============================= RENDER: FINAL QUIZ ============================= */
function renderFinal(){
  const main = document.getElementById("main");
  const pool = [];
  chapterList.forEach(s=> s.quiz.forEach(q=> pool.push(q)) );
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const picked = pool.slice(0, 20);
  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">★</div>
        <div><h1>แบบทดสอบรวมทุกบท</h1><div class="sub">สุ่ม 20 ข้อจากทุกบทของ DM CPG 2566 เพื่อทบทวนก่อนขึ้นเวร/ก่อนสอบ</div></div>
      </div>
      <div id="quizArea" style="margin-top:20px;"></div>
    </div>
  `;
  mountQuiz("final", picked, true);
}

/* ============================= MAIN RENDER ============================= */
function render(){
  renderNav();
  updateTopProgress();
  const sec = SECTIONS.find(s=>s.id===currentId);
  if(sec.isHome) renderHome();
  else if(sec.isFinal) renderFinal();
  else renderChapter(sec);
}
render();
</script>
