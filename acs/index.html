<style>

      --accent:#F29A90;
      --accent-ink:#2A0F0C;

      --danger-soft:#3A1B16;

  }
  :root[data-theme="dark"]{

    --surface:#11211C;
    --surface-2:#16261F;
    --ink:#E7F1EC;
    --muted:#93A8A1;

    --accent:#F29A90;
    --accent-ink:#2A0F0C;
    --accent-soft:#3A1E1C;

  .badge.harm{background:var(--ink); color:var(--surface);}
  .legend i.harm{background:var(--ink);}
  .bullets li a{color:var(--accent);}
  .muted-s{font-size:12.5px;color:var(--muted);margin:6px 0 12px;}
  :root{--ecg-grid:#F1C9C3;--ecg-ink:#1E1A19}

/* ============================= EXTRAS (ECG + comparison) ============================= */
function ecgPath(o){
  // baseline y=70; negative = upward on screen. units: mm*6
  const B=70, k=6;
  const r=(o.r??6)*k, s=(o.s??1.2)*k, q=(o.q??0)*k, j=(o.j??0)*k, st=(o.st??o.j??0)*k;
  const t=(o.t??2)*k, t2=(o.t2??0)*k;
  let d=`M0 ${B} L18 ${B} Q26 ${B-5} 34 ${B} L48 ${B}`;
  d+=` L51 ${B+q} L56 ${B-r} L61 ${B+s} L65 ${B-j}`;
  if(o.up){ d+=` Q72 ${B-j} 78 ${B-st}`; } else { d+=` L78 ${B-st}`; }
  if(t2){ // biphasic: up then down
    d+=` Q86 ${B-st-t} 94 ${B}` + ` Q102 ${B+t2} 110 ${B}`;
  } else {
    d+=` Q94 ${B-st-t*2} 110 ${B}`;
  }
  d+=` L140 ${B}`;
  return d;
}
function ecgFig(title, note, beats){
  const w = 150*beats.length;
  const grid = `<pattern id="g${title.length}" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0H0V6" fill="none" stroke="var(--ecg-grid)" stroke-width=".5"/></pattern>`;
  const paths = beats.map((b,i)=>`<g transform="translate(${i*150+5},0)"><path d="${ecgPath(b)}" fill="none" stroke="var(--ecg-ink)" stroke-width="2" stroke-linejoin="round"/>${b.lab?`<text x="4" y="16" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${b.lab}</text>`:""}</g>`).join("");
  return `<figure class="ecg-fig"><svg viewBox="0 0 ${w+10} 120" role="img" aria-label="${title}"><defs>${grid}</defs><rect width="100%" height="100%" fill="url(#g${title.length})"/>${paths}</svg><figcaption><b>${title}</b> — ${note}</figcaption></figure>`;
}

function seg(name, opts){
  return `<div class="seg" data-name="${name}">${opts.map((o,i)=>`<button type="button" data-v="${o[1]}" class="${i===0?'on':''}">${o[0]}</button>`).join("")}</div>`;
}
function segVal(root, name){ const b=root.querySelector(`.seg[data-name="${name}"] .on`); return b?parseFloat(b.dataset.v):0; }

              <div class="fcol"><div class="fbox warn">ไม่ใช่ → <b>ยาละลายลิ่มเลือด</b> ≤10–30 นาที<br>aspirin + clopidogrel + enoxaparin</div>

                </div>

            </div>
          </div>
          <div class="fcol">
            <div class="fbox"><b>ไม่มี ST elevation</b> → hs-troponin ซ้ำ 1–2 ชม. · ECG ซ้ำ</div>
            <div class="farrow">↓</div>

      <div class="q-row"><span>ECG เข้าเกณฑ์ STEMI / equivalent</span>${seg("ste",[["ใช่",1],["ไม่ใช่",0]])}</div>
      <div class="q-row"><span>คาดว่า diagnosis → PCI &gt;120 นาที</span>${seg("delay",[["ใช่",1],["ไม่ใช่",0]])}</div>

      <h3>ข้อห้ามสัมพัทธ์</h3><div class="ck" id="relList">${REL_CI.map((x,i)=>`<label><input type="checkbox" data-k="r${i}"> ${x}</label>`).join("")}</div>
      <div class="result" id="lysisOut"></div>
      <p class="muted-s">ข้อห้ามตาม Thai ACS 2563 และเพิ่มข้อห้ามมาตรฐานสากล (active bleeding, รอยโรคในสมอง)</p>

    <section class="tool" id="t-dose">
      <h2>คำนวณขนาดยา</h2>
      <div class="inp-row">
        <label>น้ำหนัก (กก.)<input type="number" id="dWt" value="65" min="20" max="250"></label>
        <label>อายุ (ปี)<input type="number" id="dAge" value="60" min="15" max="110"></label>

      <p class="muted-s">ใช้กับผู้ป่วยเจ็บหน้าอกที่ไม่มี STEMI เพื่อคัดผู้เสี่ยงต่ำ สำหรับ GRACE 2.0 ให้ใช้เครื่องคำนวณออนไลน์ฉบับทางการ</p>

  main.querySelectorAll(".seg").forEach(sg=>{
    sg.addEventListener("click", e=>{
      const b=e.target.closest("button"); if(!b) return;
      sg.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
      calcAll();
    });
  });
  main.querySelectorAll("input,select").forEach(el=>el.addEventListener("input", calcAll));
  main.querySelectorAll("input[type=checkbox]").forEach(el=>el.addEventListener("change", calcAll));
  calcAll();

  function calcAll(){
    const m = main;
    // lysis
    const on=segVal(m.querySelector("#t-lysis"),"on"), ste=segVal(m.querySelector("#t-lysis"),"ste"), dl=segVal(m.querySelector("#t-lysis"),"delay");
    const nAbs=m.querySelectorAll("#absList input:checked").length, nRel=m.querySelectorAll("#relList input:checked").length;
    let out;
    if(!ste) out=`<span class="tag-n">ไม่ให้</span> ไม่เข้าเกณฑ์ STEMI — ห้ามให้ยาละลายลิ่มเลือดใน NSTE-ACS หรือ ST depression อย่างเดียว (ยกเว้น true posterior)`;
    else if(nAbs) out=`<span class="tag-n">ห้ามให้</span> มีข้อห้ามสัมบูรณ์ → ส่ง primary PCI แม้จะช้า`;
    else if(!on) out=`<span class="tag-w">ไม่แนะนำ</span> อาการเกิน 12 ชม. — พิจารณาส่ง PCI (12–24 ชม. หรือยังมี ischemia/shock)`;
    else if(!dl) out=`<span class="tag-y">ส่ง Primary PCI</span> PCI ทำได้ภายใน 120 นาที ดีกว่ายาละลายลิ่มเลือด`;
    else if(nRel) out=`<span class="tag-w">ชั่งน้ำหนัก</span> มีข้อห้ามสัมพัทธ์ ${nRel} ข้อ — ประเมินประโยชน์เทียบความเสี่ยงเลือดออก ปรึกษาอายุรแพทย์โรคหัวใจ และพิจารณาส่ง PCI`;
    else out=`<span class="tag-y">ให้ได้</span> เริ่มยาละลายลิ่มเลือดภายใน 10–30 นาที แล้วส่งต่อ PCI center ทุกราย`;
    m.querySelector("#lysisOut").innerHTML=out;

    // dose
    const wt=parseFloat(m.querySelector("#dWt").value)||0, age=parseFloat(m.querySelector("#dAge").value)||0, cr=parseFloat(m.querySelector("#dCr").value)||1, fem=m.querySelector("#dSex").value==="f";
    const crcl = Math.round(((140-age)*wt)/(72*cr)*(fem?0.85:1));
    let tnk = wt<60?30: wt<70?35: wt<80?40: wt<90?45:50;
    const tnkTxt = age>=75 ? `${tnk/2} มก. (ครึ่งขนาดเพราะอายุ ≥75 ปี; ขนาดเต็มตามน้ำหนัก ${tnk} มก.)` : `${tnk} มก. IV bolus ครั้งเดียว`;
    const alt1=Math.min(0.75*wt,50), alt2=Math.min(0.5*wt,35);
    let enoxLysis;
    if(crcl<30) enoxLysis=`${Math.round(wt)} มก. SC q24h (CrCl &lt;30)${age<75?" + 30 มก. IV bolus":" ไม่ bolus"}`;
    else if(age>=75) enoxLysis=`${Math.round(0.75*wt)} มก. SC q12h ไม่ bolus (สูงสุด 75 มก./dose สำหรับ 2 dose แรก)`;
    else enoxLysis=`30 มก. IV bolus แล้ว ${Math.round(wt)} มก. SC q12h (สูงสุด 100 มก./dose สำหรับ 2 dose แรก)`;
    const enoxNste = crcl<30 ? `${Math.round(wt)} มก. SC q24h` : `${Math.round(wt)} มก. SC q12h`;
    const ufhB=Math.min(Math.round(60*wt),4000), ufhI=Math.min(Math.round(12*wt),1000);
    const clopi = age>75 ? "75 มก. ไม่ loading (อายุ >75 ปี)" : "300 มก. loading แล้ว 75 มก./วัน";
    const pras = (age>=75||wt<=60) ? "60 มก. แล้ว 5 มก./วัน (อายุ ≥75 หรือ ≤60 กก.)" : "60 มก. แล้ว 10 มก./วัน";
    m.querySelector("#doseOut").innerHTML = `
      <div class="dl"><b>CrCl ประมาณ</b><span>${isFinite(crcl)?crcl:"—"} มล./นาที</span></div>
      <div class="dl"><b>Tenecteplase</b><span>${tnkTxt}</span></div>
      <div class="dl"><b>Alteplase</b><span>15 มก. bolus → ${alt1.toFixed(1)} มก. ใน 30 นาที → ${alt2.toFixed(1)} มก. ใน 60 นาที (รวม ${(15+alt1+alt2).toFixed(1)} มก.)</span></div>
      <div class="dl"><b>Streptokinase</b><span>1.5 ล้านยูนิต ใน NSS 100 มล. หยด 30–60 นาที</span></div>
      <div class="dl"><b>Enoxaparin + ยาละลายลิ่มเลือด</b><span>${enoxLysis}</span></div>
      <div class="dl"><b>Enoxaparin ใน NSTE-ACS</b><span>${enoxNste}</span></div>
      <div class="dl"><b>UFH + ยาละลายลิ่มเลือด</b><span>${ufhB} ยูนิต IV แล้ว ${ufhI} ยูนิต/ชม. (aPTT 1.5–2 เท่า)</span></div>
      <div class="dl"><b>Clopidogrel + ยาละลายลิ่มเลือด</b><span>${clopi}</span></div>
      <div class="dl"><b>Prasugrel (ถ้าไม่เคย stroke/TIA)</b><span>${pras}</span></div>
      ${crcl<15?'<div class="warnline">CrCl &lt;15: หลีกเลี่ยง enoxaparin/fondaparinux ใช้ UFH แทน</div>':''}
      ${crcl<20&&crcl>=15?'<div class="warnline">CrCl &lt;20: หลีกเลี่ยง fondaparinux</div>':''}`;

    // TIMI STEMI
    const ts = TIMI_ST.reduce((a,x)=>a+segVal(m.querySelector("#t-timist"),x[0]),0);
    m.querySelector("#timistOut").innerHTML = `<b class="big">${ts}</b> / 14 คะแนน · อัตราตายที่ 30 วันประมาณ <b>${TIMI_ST_MORT[Math.min(ts,9)]}%</b>`;
    // TIMI NSTE
    const tn = m.querySelectorAll("#timinstList input:checked").length;
    m.querySelector("#timinstOut").innerHTML = `<b class="big">${tn}</b> / 7 คะแนน · death/MI/urgent revascularization ที่ 14 วันประมาณ <b>${TIMI_NST_RISK[tn]}%</b> ${tn>=5?"· เสี่ยงสูง":tn>=3?"· เสี่ยงปานกลาง":"· เสี่ยงต่ำ"}`;
    // HEART
    const hs = HEART.reduce((a,x)=>a+segVal(m.querySelector("#t-heart"),x[0]),0);
    const hr = hs<=3 ? "เสี่ยงต่ำ (MACE 6 สัปดาห์ราว 1–2%) → พิจารณาจำหน่ายพร้อมนัดติดตาม" : hs<=6 ? "เสี่ยงปานกลาง (MACE ราว 12–17%) → admit/สังเกตอาการ ทำ troponin ซ้ำและ non-invasive test" : "เสี่ยงสูง (MACE ราว 50–65%) → รักษาแบบ ACS พิจารณา invasive เร็ว";
    m.querySelector("#heartOut").innerHTML = `<b class="big">${hs}</b> / 10 คะแนน · ${hr}`;
  }
}

/* ============================= STATE ============================= */
const PROGRESS_KEY = "acs_progress_v1";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }catch(e){}
}
let PROGRESS = loadProgress();
const chapterList = SECTIONS.filter(s=>!s.isHome && !s.isFinal && !s.isTool);

function chapterDone(id){
  const p = PROGRESS[id];
  return !!(p && p.quizDone);
}
function overallPercent(){
  const total = chapterList.length;
  const done = chapterList.filter(s=>chapterDone(s.id)).length;
  return Math.round(done/total*100);
}
function updateTopProgress(){
  const pct = overallPercent();
  document.getElementById("topProgressBar").style.width = pct+"%";
  document.getElementById("topProgressText").textContent = pct+"%";
}

/* ============================= NAV ============================= */
let currentId = "home";

function renderNav(){
  const nav = document.getElementById("sidenav");
  nav.innerHTML = "";
  const label = document.createElement("div");
  label.className = "grp-label"; label.textContent = "ACS 2025";
  nav.appendChild(label);
  SECTIONS.forEach(s=>{
    const btn = document.createElement("button");
    btn.className = "navitem" + (s.id===currentId ? " active":"");
    const n = document.createElement("span"); n.className="n"; n.textContent = s.isHome ? "•" : (s.isFinal ? "★" : s.n);
    btn.appendChild(n);
    const t = document.createElement("span"); t.textContent = s.nav; btn.appendChild(t);
    if(!s.isHome && !s.isFinal && !s.isTool){
      const chk = document.createElement("span");
      chk.className = "check" + (chapterDone(s.id) ? " done":"");
      btn.appendChild(chk);
    }
    btn.onclick = ()=>{ currentId = s.id; render(); window.scrollTo({top:0,behavior:"smooth"}); };
    nav.appendChild(btn);
  });
}

/* ============================= RENDER: HOME ============================= */
function renderHome(){
  const main = document.getElementById("main");
  const pct = overallPercent();
  let statTiles = MUST_KNOW.map(m=>`<div class="stat-tile"><div class="v">${m.v}</div><div class="l">${m.l}</div></div>`).join("");
  let progRows = chapterList.map(s=>{
    const p = PROGRESS[s.id];
    const score = p && p.quizBest ? p.quizBest.correct+"/"+p.quizBest.total : "—";
    const barPct = p && p.quizBest ? Math.round(p.quizBest.correct/p.quizBest.total*100) : 0;
    return `<div class="ch-progress-row">
      <div class="t">${s.n}. ${s.title}</div>
      <div class="bar"><i style="width:${barPct}%"></i></div>
      <div class="score">${score}</div>
    </div>`;
  }).join("");
  main.innerHTML = `
    <div class="panel hero">
      <span class="hero-tag">Thai ACS Guidelines 2563 · ACC/AHA/ACEP/NAEMSP/SCAI 2025</span>
      <h1>ห้องเรียน Acute Coronary Syndrome</h1>
      <p class="lead">สรุป ACS สำหรับแพทย์เวชปฏิบัติทั่วไป นักศึกษาแพทย์ และผู้เตรียมเรียนต่ออายุรศาสตร์ ตั้งแต่ ECG ใน 10 นาทีแรก การเลือก primary PCI หรือยาละลายลิ่มเลือดในบริบท รพ.ที่ต้องส่งต่อ ไปจนถึงยาหลังจำหน่าย พร้อมเครื่องมือข้างเตียง แฟลชการ์ด และแบบทดสอบท้ายบท</p>
      <div class="cta-row">
        <button class="btn primary" onclick="goTo('def')">เริ่มเรียนบทที่ 1 →</button>
        <button class="btn" onclick="goTo('tools')">เครื่องมือข้างเตียง</button>
        <button class="btn" onclick="goTo('final')">ทำแบบทดสอบรวม</button>

    <div class="section-h"><h2>ตัวเลขที่ต้องจำขึ้นใจ</h2><div class="line"></div></div>

    <div class="section-h"><h2>ความคืบหน้ารายบท</h2><div class="line"></div></div>

    <div class="footnote"><b>อ้างอิง</b><br>
      1. สมาคมแพทย์โรคหัวใจแห่งประเทศไทยฯ และคณะ. แนวเวชปฏิบัติการดูแลรักษาผู้ป่วยภาวะหัวใจขาดเลือดเฉียบพลัน พ.ศ. 2563 (Thai Acute Coronary Syndromes Guidelines 2020).<br>
      2. Rao SV, O'Donoghue ML, Ruel M, et al. 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary Syndromes. Circulation. 2025;151(13):e771–e862. doi:10.1161/CIR.0000000000001309<br>
      3. Thygesen K, et al. Fourth Universal Definition of Myocardial Infarction (2018). Eur Heart J. 2019;40:237–269.<br>
      4. Byrne RA, et al. 2023 ESC Guidelines for the management of acute coronary syndromes. Eur Heart J. 2023;44:3720–3826.<br>
      5. Morrow DA, et al. TIMI risk score for STEMI. Circulation 2000;102:2031–7 · Antman EM, et al. TIMI risk score for UA/NSTEMI. JAMA 2000;284:835–42 · Six AJ, et al. HEART score. Neth Heart J 2008;16:191–6.<br>
      เนื้อหาเพื่อการศึกษา การสั่งยาให้ตรวจสอบกับฉลากยาและแนวทางของโรงพยาบาล · เรียบเรียงโดย นพ.ปฐมพงษ์ คูเจริญไพศาล</div>

window.goTo = (id)=>{ currentId = id; render(); window.scrollTo({top:0,behavior:"smooth"}); };

/* ============================= RENDER: CHAPTER ============================= */
function renderChapter(sec){
  const main = document.getElementById("main");
  let chips = sec.chips.map(c=>`<div class="chip"><b>${c.v}</b>${c.l}</div>`).join("");
  let bullets = sec.bullets.map(b=>`<li><span>${b}</span></li>`).join("");
  let recs = sec.recs.map(r=>{
    if(!r.s) return `<div class="rec-row"><div class="badges"></div><div class="txt">${r.t}</div></div>`;
    const cls = r.s==="strong" ? "strong" : (r.s==="harm" ? "harm" : "conditional");
    const label = r.c || COR_LABEL[r.s];
    return `<div class="rec-row">
      <div class="badges"><span class="badge ${cls}">${label}</span><span class="evid">${r.e}</span></div>
      <div class="txt">${r.t}</div>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">${sec.n}</div>
        <div>
          <h1>${sec.title}</h1>
          <div class="sub">${sec.sub}</div>
        </div>
      </div>
      <div class="chip-row">${chips}</div>

      <div class="section-h"><h2>สรุปสาระสำคัญ</h2><div class="line"></div></div>
      <ul class="bullets">${bullets}</ul>
      ${sec.extraKey ? EXTRAS[sec.extraKey]() : ""}

      ${sec.recs.length ? `
      <div class="section-h"><h2>คำแนะนำหลัก</h2><div class="line"></div></div>
      <div class="legend">
        <span><i class="strong"></i> Class 1 — แนะนำ/ควรทำ</span>
        <span><i class="conditional"></i> Class 2a/2b — สมเหตุสมผล/อาจพิจารณา</span>
        <span><i class="harm"></i> Class 3 — ไม่มีประโยชน์/อันตราย</span>
      </div>
      ${recs}` : ""}

      <div class="section-h"><h2>แฟลชการ์ดจำขึ้นใจ</h2><div class="line"></div></div>
      <div id="fcArea"></div>

      <div class="section-h"><h2>แบบทดสอบท้ายบท</h2><div class="line"></div></div>
      <div id="quizArea"></div>

    </div>
  `;
  mountFlashcards(sec);
  mountQuiz(sec.id, sec.quiz);
}

/* ============================= FLASHCARDS ============================= */
function mountFlashcards(sec){
  const area = document.getElementById("fcArea");
  let idx = 0;
  const cards = sec.cards;
  function draw(){
    area.innerHTML = `
      <div class="fc-counter">การ์ด ${idx+1} / ${cards.length} — คลิกที่การ์ดเพื่อดูคำตอบ</div>
      <div class="flashcard" id="fcCard">
        <div class="inner">
          <div class="face front">${cards[idx].f}<span class="hint">คลิกเพื่อดูคำตอบ</span></div>
          <div class="face back">${cards[idx].b}<span class="hint">คลิกเพื่อกลับ</span></div>
        </div>
      </div>
      <div class="fc-controls">
        <button class="icon-btn" id="fcPrev">← ก่อนหน้า</button>
        <button class="icon-btn" id="fcShuf">สุ่มการ์ด</button>
        <button class="icon-btn" id="fcNext">ถัดไป →</button>
      </div>
    `;
    const card = document.getElementById("fcCard");
    card.onclick = ()=> card.classList.toggle("flip");
    document.getElementById("fcPrev").onclick = ()=>{ idx = (idx-1+cards.length)%cards.length; draw(); };
    document.getElementById("fcNext").onclick = ()=>{ idx = (idx+1)%cards.length; draw(); markCardsSeen(sec.id); };
    document.getElementById("fcShuf").onclick = ()=>{ idx = Math.floor(Math.random()*cards.length); draw(); };
  }
  draw();
}
function markCardsSeen(id){
  PROGRESS[id] = PROGRESS[id] || {};
  PROGRESS[id].cardsSeen = true;
  saveProgress(PROGRESS);
}

/* ============================= QUIZ ============================= */
function mountQuiz(id, questions, isFinal){
  const area = document.getElementById("quizArea");
  let qi = 0, correct = 0, answered = false;
  const order = questions.map((_,i)=>i);

  function progressDots(){
    return `<div class="quiz-progress">${order.map((_,i)=>`<i class="${i<qi?'done':''}"></i>`).join("")}</div>`;
  }

  function drawQuestion(){
    answered = false;
    const q = questions[order[qi]];
    area.innerHTML = `
      <div class="quiz-box">
        ${progressDots()}
        <div class="quiz-q">${qi+1}. ${q.q}</div>
        <div id="choices">${q.c.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${String.fromCharCode(65+i)}</span><span>${c}</span></button>`).join("")}</div>
        <div class="explain" id="explainBox">${q.e}</div>
        <div class="quiz-foot">
          <span class="quiz-score">คะแนน: ${correct}/${qi}</span>
          <button class="btn primary" id="nextBtn" style="display:none;">${qi===order.length-1 ? "ดูผลลัพธ์" : "ข้อถัดไป →"}</button>
        </div>
      </div>
    `;
    document.querySelectorAll("#choices .choice").forEach(btn=>{
      btn.onclick = ()=>{
        if(answered) return;
        answered = true;
        const i = parseInt(btn.dataset.i);
        document.querySelectorAll("#choices .choice").forEach(b=>b.setAttribute("disabled","true"));
        if(i===q.a){ btn.classList.add("correct"); correct++; }
        else{
          btn.classList.add("wrong");
          document.querySelectorAll("#choices .choice")[q.a].classList.add("correct");
        }
        document.getElementById("explainBox").classList.add("show");
        document.querySelector(".quiz-score").textContent = "คะแนน: "+correct+"/"+(qi+1);
        document.getElementById("nextBtn").style.display = "inline-flex";
      };
    });
    document.getElementById("nextBtn").onclick = ()=>{
      qi++;
      if(qi>=order.length){ finish(); } else { drawQuestion(); }
    };
  }

  function finish(){
    const pct = Math.round(correct/order.length*100);
    area.innerHTML = `
      <div class="quiz-box quiz-done">
        <div style="font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;">ผลการทดสอบ</div>
        <div class="v">${correct}/${order.length}</div>
        <p style="color:var(--muted);margin-top:6px;">คิดเป็น ${pct}% — ${pct>=80?"ยอดเยี่ยม จำแม่นมาก!":pct>=50?"ดี ลองทบทวนข้อที่พลาดอีกครั้ง":"ควรทบทวนสรุปสาระสำคัญและคำแนะนำหลักอีกรอบ"}</p>
        <div class="cta-row" style="justify-content:center;">
          <button class="btn" id="retryBtn">ทำแบบทดสอบอีกครั้ง</button>
          ${!isFinal ? `<button class="btn primary" id="nextChBtn">ไปบทถัดไป →</button>` : ""}
        </div>
      </div>
    `;
    if(!isFinal){
      PROGRESS[id] = PROGRESS[id] || {};
      PROGRESS[id].quizDone = true;
      const prevBest = PROGRESS[id].quizBest;
      if(!prevBest || correct > prevBest.correct){ PROGRESS[id].quizBest = {correct, total: order.length}; }
      saveProgress(PROGRESS);
      renderNav();
      updateTopProgress();
    }
    document.getElementById("retryBtn").onclick = ()=>{ qi=0; correct=0; drawQuestion(); };
    const nb = document.getElementById("nextChBtn");
    if(nb){
      nb.onclick = ()=>{
        const idx = chapterList.findIndex(s=>s.id===id);
        const next = chapterList[idx+1];
        currentId = next ? next.id : "final";
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      };
    }
  }

  drawQuestion();
}

/* ============================= RENDER: FINAL QUIZ ============================= */
function renderFinal(){
  const main = document.getElementById("main");
  const pool = [];
  chapterList.forEach(s=> s.quiz.forEach(q=> pool.push(q)) );
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const picked = pool.slice(0, 15);
  main.innerHTML = `
    <div class="panel">
      <div class="ch-head">
        <div class="bignum">★</div>
        <div><h1>แบบทดสอบรวมทุกบท</h1><div class="sub">สุ่ม 15 ข้อจากทั้ง 7 บท เพื่อทบทวนก่อนขึ้นเวร/ก่อนสอบ</div></div>
      </div>
      <div id="quizArea" style="margin-top:20px;"></div>
    </div>
  `;
  mountQuiz("final", picked, true);
}

/* ============================= MAIN RENDER ============================= */
function render(){
  renderNav();
  updateTopProgress();
  const sec = SECTIONS.find(s=>s.id===currentId);
  if(sec.isHome) renderHome();
  else if(sec.isFinal) renderFinal();
  else if(sec.isTool) renderTools();
  else renderChapter(sec);
  mountChapBar(sec);
}
function mountChapBar(sec){
  const main=document.getElementById("main");
  const items=SECTIONS.map(s=>{
    const num = s.isHome ? "⌂" : (s.isFinal ? "★" : s.n);
    const done = (!s.isHome && !s.isFinal && !s.isTool && chapterDone(s.id)) ? " done" : "";
    return `<button type="button" class="cb-item${s.id===sec.id?' on':''}${done}" onclick="goTo('${s.id}')"><i>${num}</i>${s.nav}</button>`;
  }).join("");
  main.insertAdjacentHTML("afterbegin", `<nav class="chapbar" aria-label="เลือกบท">${items}</nav>`);
  const idx=SECTIONS.findIndex(s=>s.id===sec.id);
  const prev=SECTIONS[idx-1], next=SECTIONS[idx+1];
  const btn=(s,dir)=> s ? `<button type="button" class="pn ${dir}" onclick="goTo('${s.id}')"><small>${dir==='prev'?'← บทก่อนหน้า':'บทถัดไป →'}</small>${s.isHome?'หน้าแรก':(s.isFinal||s.isTool?'':s.n+'. ')+s.nav}</button>` : `<span></span>`;
  if(!sec.isHome) main.insertAdjacentHTML("beforeend", `<div class="pn-row">${btn(prev,'prev')}${btn(next,'next')}</div>`);
}
render();
</script>
